<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Générateur Cerfa 14367*01</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>

<style>
body { font-family: sans-serif; background:#0b1120; color:white; padding:20px; }
input { width:100%; margin:4px 0; padding:6px; }
button { padding:10px; margin-top:10px; cursor:pointer; }
canvas { background:white; width:100%; height:120px; }
</style>
</head>

<body>

<h2>Générateur Cerfa</h2>

<h3>Animaux</h3>
<div id="animals"></div>

<h3>Cédant</h3>
<input id="cNom" placeholder="Nom">
<input id="cNum" placeholder="Numéro">
<input id="cExt" placeholder="Extension">
<input id="cRue" placeholder="Rue">
<input id="cCP" placeholder="Code postal">
<input id="cVille" placeholder="Ville">
<input id="cPays" value="France">

<h3>Acheteur</h3>
<input id="aNom">
<input id="aNum">
<input id="aExt">
<input id="aRue">
<input id="aCP">
<input id="aVille">
<input id="aPays" value="France">

<h3>Signature</h3>
<input id="lieu" placeholder="Lieu">
<input id="date" placeholder="JJ/MM/AAAA">

<p>Cédant</p>
<canvas id="c1"></canvas>
<button onclick="pad1.clear()">Effacer</button>

<p>Acheteur</p>
<canvas id="c2"></canvas>
<button onclick="pad2.clear()">Effacer</button>

<button id="gen">GÉNÉRER PDF</button>

<script>
// =======================
// INIT TABLEAU A
// =======================
const animalsDiv = document.getElementById("animals");

for (let i=0;i<5;i++){
  animalsDiv.innerHTML += `
    <input id="sci${i}" placeholder="Nom scientifique">
    <input id="com${i}" placeholder="Nom commun">
    <input id="qty${i}" placeholder="Qté">
    <input id="dsc${i}" placeholder="Description">
    <input id="sta${i}" placeholder="Statut">
    <hr>
  `;
}

// =======================
// SIGNATURES
// =======================
const initPad = (id)=>{
  const canvas = document.getElementById(id);
  const ratio = window.devicePixelRatio || 1;
  canvas.width = canvas.offsetWidth * ratio;
  canvas.height = canvas.offsetHeight * ratio;
  canvas.getContext("2d").scale(ratio, ratio);
  return new SignaturePad(canvas);
};

const pad1 = initPad("c1");
const pad2 = initPad("c2");

// =======================
// UTILS
// =======================
const v = id => document.getElementById(id)?.value.trim() || "";

// coupe texte si trop long
const cut = (txt, max=40)=>{
  if(txt.length > max) return txt.slice(0,max);
  return txt;
};

// =======================
// GENERATION PDF
// =======================
document.getElementById("gen").onclick = async ()=>{

const { PDFDocument, rgb, StandardFonts } = PDFLib;

const bytes = await fetch("cerfa-14367-01.pdf").then(r=>r.arrayBuffer());
const pdf = await PDFDocument.load(bytes);

const font = await pdf.embedFont(StandardFonts.Helvetica);
const page = pdf.getPages()[0];
const { height } = page.getSize();

const draw = (txt,x,y,size=9)=>{
  if(!txt) return;
  page.drawText(txt,{
    x,
    y: height - y,
    size,
    font,
    color: rgb(0,0,0)
  });
};

// =======================
// TABLEAU A (PARFAIT)
// =======================
const startY = 195;
const gap = 30;

for(let i=0;i<5;i++){
  let y = startY + i*gap;

  draw(cut(v(`sci${i}`),30), 50, y, 8);
  draw(cut(v(`com${i}`),30), 50, y+10, 8);

  draw(v(`qty${i}`), 235, y+5);
  draw(cut(v(`dsc${i}`),35), 290, y+5, 8);
  draw(cut(v(`sta${i}`),25), 480, y+5, 8);
}

// =======================
// CEDANT
// =======================
draw(cut(v("cNom"),50),170,445);

const adrC = [v("cNum"),v("cExt"),v("cRue")].join(" ");
draw(cut(adrC,60),95,465);

// code postal cases
v("cCP").split("").forEach((n,i)=>{
  draw(n,95+i*12,485);
});

draw(v("cVille"),170,485);
draw(v("cPays"),360,485);

// =======================
// ACHETEUR
// =======================
draw(cut(v("aNom"),50),170,530);

const adrA = [v("aNum"),v("aExt"),v("aRue")].join(" ");
draw(cut(adrA,60),95,550);

v("aCP").split("").forEach((n,i)=>{
  draw(n,95+i*12,570);
});

draw(v("aVille"),170,570);
draw(v("aPays"),360,570);

// =======================
// DATE
// =======================
draw(v("lieu"),230,640);

let d = v("date").split("/");
if(d.length===3){
  d[0].split("").forEach((n,i)=>draw(n,420+i*12,640));
  d[1].split("").forEach((n,i)=>draw(n,450+i*12,640));
  d[2].split("").forEach((n,i)=>draw(n,480+i*12,640));
}

// =======================
// SIGNATURES
// =======================
const drawSig = async(pad,x,y)=>{
  if(!pad.isEmpty()){
    const img = await pdf.embedPng(pad.toDataURL());
    page.drawImage(img,{
      x,
      y: height - y,
      width:130,
      height:50
    });
  }
};

await drawSig(pad1,60,720);
await drawSig(pad2,320,720);

// =======================
// EXPORT
// =======================
const final = await pdf.save();
const blob = new Blob([final],{type:"application/pdf"});

const url = URL.createObjectURL(blob);
const a = document.createElement("a");

a.href = url;
a.download = "cerfa.pdf";
a.click();

URL.revokeObjectURL(url);

};
</script>

</body>
</html>
