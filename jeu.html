<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Meta-Aqua - Le Jeu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* --- DESIGN GLOBAL DU SITE --- */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #020617; color: #e5e7eb; min-height: 100vh; }
    .navbar { position: fixed; top: 0; left: 0; width: 100%; min-height: 56px; background: rgba(15, 23, 42, 0.98); border-bottom: 1px solid #1f2937; display: flex; align-items: center; justify-content: space-between; padding: 4px 16px; z-index: 50; }
    .navbar-title { font-size: 0.95rem; font-weight: 600; color: #e5e7eb; }
    .page { padding-top: 72px; padding-left: 12px; padding-right: 12px; padding-bottom: 20px; max-width: 900px; margin: 0 auto; }
    .card { background: #111827; border-radius: 10px; border: 1px solid #1f2937; padding: 16px; margin-bottom: 14px; overflow: hidden; }
    h1 { font-size: 1.4rem; color: #38bdf8; margin-bottom: 8px; }
    h2 { font-size: 1.1rem; color: #e5e7eb; margin-bottom: 8px; border-bottom: 1px solid #1f2937; padding-bottom: 5px; }

    /* --- UI DU JEU --- */
    .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .compteur { font-size: 0.9rem; font-weight: bold; padding: 4px 10px; background: #1f2937; border-radius: 6px; color: #facc15; border: 1px solid #374151;}
    .input-group { display: flex; gap: 10px; margin-top: 5px; }
    input { flex: 1; padding: 10px; background: #020617; border: 1px solid #374151; border-radius: 6px; color: #e5e7eb; font-size: 1rem;}
    input:focus { border-color: #38bdf8; outline: none; }
    button.btn-play { background: #38bdf8; color: #020617; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button.btn-play:hover { background: #0ea5e9; }
    #error-msg { margin-top: 8px; font-size: 0.9rem; color: #ef4444; }
    .correction-link { color: #38bdf8; text-decoration: underline; cursor: pointer; font-weight: bold; }

    /* --- VRAI ARBRE PHYLOGÉNÉTIQUE (STYLE METAZOOA) --- */
    #arbre-dynamique {
      padding: 10px 0;
      overflow-x: auto;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    ul.tree { list-style: none; padding-left: 0; margin: 0; }
    ul.tree ul { list-style: none; padding-left: 40px; margin: 0; }
    
    li.node { position: relative; padding: 10px 0; animation: fadeIn 0.4s ease-out; }
    
    /* Ligne verticale de l'arbre */
    li.node::before {
      content: ''; position: absolute; top: -10px; bottom: 0; left: -20px;
      border-left: 2px solid #4b5563;
    }
    /* Ligne horizontale de l'arbre */
    li.node::after {
      content: ''; position: absolute; top: 33px; left: -20px; width: 20px;
      border-top: 2px solid #4b5563;
    }
    /* Coupe la ligne verticale à la dernière branche */
    li.node:last-child::before { bottom: auto; height: 43px; }
    
    /* Pas de lignes pour la racine */
    ul.root-ul > li.node::before { display: none; }
    ul.root-ul > li.node::after { display: none; }

    /* --- LES BOÎTES (TAXONS) --- */
    .box {
      display: inline-block; padding: 8px 14px; border-radius: 8px;
      border: 2px solid transparent; min-width: 220px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2); position: relative; z-index: 10;
    }
    
    /* La racine (Poissons) */
    .root-box { background: #1e3a8a; border-color: #3b82f6; }
    .root-box .box-rank { color: #93c5fd; }
    
    /* Le chemin correct (Vert) */
    .main-box { background: rgba(34, 197, 94, 0.1); border-color: #22c55e; }
    .main-box .box-name { color: #4ade80; }
    
    /* Le prochain à trouver (Gris avec "???") */
    .unknown-box { background: #020617; border-color: #4b5563; border-style: dashed; }
    .unknown-box .box-name { color: #9ca3af; font-style: italic; }
    
    /* Les mauvaises branches (Rouge sombre) */
    .wrong-box { background: #3f0a0a; border-color: #ef4444; opacity: 0.9; }
    .wrong-box .box-name { color: #fca5a5; font-style: italic; }
    
    .box-rank { display: block; font-size: 0.7rem; color: #9ca3af; text-transform: uppercase; font-weight: bold; margin-bottom: 2px; }
    .box-name { display: block; font-size: 1.05rem; font-weight: bold; color: #e5e7eb; }

    @keyframes fadeIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

    /* --- BOUTON INDICE & FIN --- */
    .btn-hint { background: #f59e0b; color: #020617; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; width: 100%; transition: 0.2s; }
    .btn-hint:hover { background: #d97706; }
    .btn-hint:disabled { background: #4b5563; color: #9ca3af; cursor: not-allowed; }
    #hints-container p { background: #1f2937; border-left: 4px solid #f59e0b; padding: 10px; margin-bottom: 8px; border-radius: 4px; font-size: 0.9rem; }
    .end-screen { display: none; margin-top: 15px; padding: 15px; border-radius: 8px; text-align: center; }
    .victory { background: rgba(34, 197, 94, 0.1); border: 1px solid #22c55e; }
    .defeat { background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; }
  </style>

  <script src="especes.js"></script>
</head>
<body>

  <header class="navbar">
    <div class="navbar-title">Espace adhérent</div>
  </header>

  <main class="page">
    
    <div class="card">
      <div class="game-header">
        <h1>Meta-Aqua</h1>
        <div class="compteur">Essais restants : <span id="essais-restants">30</span></div>
      </div>
      <p style="color:#9ca3af; font-size:0.85rem;">Devine l'espèce mystère. Les branches de l'arbre se construiront selon tes réponses.</p>
      
      <div class="input-group">
        <input list="liste-poissons" id="guess-input" placeholder="Tape un nom scientifique..." autocomplete="off">
        <datalist id="liste-poissons"></datalist>
        <button class="btn-play" id="btn-submit" onclick="jouer()">Valider</button>
      </div>
      <div id="error-msg"></div>

      <div id="end-screen" class="end-screen">
        <h2 id="end-title" style="border: none;"></h2>
        <p id="end-text"></p>
        <img id="end-img" src="" alt="Espèce" style="max-width: 100%; border-radius: 8px; margin-top: 10px; display: none; margin-left:auto; margin-right:auto;">
      </div>
    </div>

    <div class="card">
      <h2>Arbre Phylogénétique</h2>
      <div id="arbre-dynamique">
        </div>
    </div>

    <div class="card">
      <h2>💡 Besoin d'un indice ?</h2>
      <div id="hints-container"></div>
      <button class="btn-hint" onclick="donnerIndice()" id="btn-hint">Révéler un indice</button>
    </div>

  </main>

  <script>
    let mystere = null;
    let tentatives = 30;
    const MAX_TENTATIVES = 30;
    let nbIndices = 0;
    
    let historiques = []; 
    let highestMatch = 0; // Niveau partagé : 0=Classe, 1=Ordre, 2=Famille, 3=Genre, 4=Espèce

    window.onload = () => {
      if (typeof window.FICHES === "undefined" || window.FICHES.length === 0) {
        document.getElementById("error-msg").innerText = "Erreur : Impossible de charger especes.js.";
        return;
      }

      mystere = window.FICHES[Math.floor(Math.random() * window.FICHES.length)];
      console.log("Solution (Ne pas regarder !) : " + mystere.nomScientifique);

      const datalist = document.getElementById("liste-poissons");
      window.FICHES.forEach(p => {
        let option = document.createElement("option");
        option.value = p.nomScientifique;
        datalist.appendChild(option);
      });

      genererArbre();
    };

    // --- CONSTRUCTION DE LA DONNÉE DE L'ARBRE ---
    function buildTreeData() {
      let root = { name: "Actinopterygii (Poissons)", rank: "Règne / Classe", isMain: true, isRevealed: true, children: [] };
      const mainRanks = ["Ordre", "Famille", "Genre", "Espèce"];
      const mainValues = [mystere.ordre, mystere.famille, mystere.genre, mystere.nomScientifique];

      // 1. Construit le tronc principal jusqu'au prochain "???"
      let currentMain = root;
      let maxAffichage = historiques.length === 0 ? -1 : Math.min(highestMatch, 3);
      
      for (let i = 0; i <= maxAffichage; i++) {
        let isUnknown = (i === highestMatch && highestMatch < 4);
        let node = {
          name: isUnknown ? "???" : mainValues[i],
          rank: mainRanks[i],
          isMain: true,
          isRevealed: !isUnknown,
          isUnknown: isUnknown,
          children: []
        };
        currentMain.children.push(node);
        currentMain = node;
      }

      // 2. Greffe les mauvaises réponses sur les branches
      historiques.forEach(h => {
        const guessVals = [h.obj.ordre, h.obj.famille, h.obj.genre, h.obj.nomScientifique];
        let current = root;

        for (let i = 0; i < 4; i++) {
          let val = guessVals[i];
          if (val === mainValues[i] && i < highestMatch) {
            current = current.children.find(c => c.isMain); // Suit le bon chemin
          } else {
            // Divergence (ou suite d'une divergence)
            let child = current.children.find(c => !c.isMain && c.name === val);
            if (!child) {
              child = { name: val, rank: mainRanks[i], isMain: false, isRevealed: true, isUnknown: false, children: [] };
              current.children.push(child);
            }
            current = child;
          }
        }
      });

      // 3. Trie les branches pour que le chemin correct (vert) s'affiche TOUJOURS EN BAS
      function sortChildren(node) {
        if (node.children.length > 0) {
          node.children.sort((a, b) => {
            if (a.isMain && !b.isMain) return 1;
            if (!a.isMain && b.isMain) return -1;
            return a.name.localeCompare(b.name);
          });
          node.children.forEach(sortChildren);
        }
      }
      sortChildren(root);

      return root;
    }

    // --- RENDU HTML RÉCURSIF DE L'ARBRE ---
    function renderTreeHTML(node, isRoot = false) {
      let boxClass = "box";
      if (isRoot) boxClass += " root-box";
      else if (node.isMain && node.isUnknown) boxClass += " unknown-box";
      else if (node.isMain) boxClass += " main-box";
      else boxClass += " wrong-box";

      let html = `<li class="node">
        <div class="${boxClass}">
          <span class="box-rank">${node.rank}</span>
          <span class="box-name">${node.name}</span>
        </div>`;

      if (node.children.length > 0) {
        html += `<ul class="tree">`;
        node.children.forEach(child => {
          html += renderTreeHTML(child, false);
        });
        html += `</ul>`;
      }
      html += `</li>`;
      return html;
    }

    function genererArbre() {
      let data = buildTreeData();
      let html = `<ul class="tree root-ul">${renderTreeHTML(data, true)}</ul>`;
      document.getElementById("arbre-dynamique").innerHTML = html;
    }

    // --- CORRECTION ORTHOGRAPHIQUE ---
    function nettoyer(str) { return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim(); }
    function levenshtein(a, b) {
      const mat = [];
      for (let i = 0; i <= b.length; i++) mat[i] = [i];
      for (let j = 0; j <= a.length; j++) mat[0][j] = j;
      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          if (b.charAt(i-1) === a.charAt(j-1)) mat[i][j] = mat[i-1][j-1];
          else mat[i][j] = Math.min(mat[i-1][j-1]+1, Math.min(mat[i][j-1]+1, mat[i-1][j]+1));
        }
      }
      return mat[b.length][a.length];
    }
    function appliquerCorrection(nomCorrect) {
      document.getElementById("guess-input").value = nomCorrect;
      jouer();
    }

    function donnerIndice() {
      const container = document.getElementById("hints-container");
      const btnHint = document.getElementById("btn-hint");
      nbIndices++;
      let text = "";
      if (nbIndices === 1) text = `🌍 <strong>Continent :</strong> ${mystere.continent || "Inconnu"}`;
      else if (nbIndices === 2) text = `📍 <strong>Pays :</strong> ${mystere.pays && mystere.pays.length > 0 ? mystere.pays.join(", ") : "Inconnu"}`;
      else if (nbIndices === 3) {
        text = `🖼️ <strong>Image :</strong><br>`;
        if (mystere.image) text += `<img src="${mystere.image}" style="max-width:200px; border-radius:8px; margin-top:10px; opacity:0.9; filter: blur(4px);">`;
        else text += `<em>Aucune photo disponible.</em>`;
        btnHint.disabled = true;
        btnHint.textContent = "Tous les indices donnés";
      }
      const p = document.createElement("p");
      p.innerHTML = text;
      container.appendChild(p);
    }

    // --- MOTEUR DE JEU ---
    function jouer() {
      if (!window.FICHES || tentatives <= 0) return;
      
      const input = document.getElementById("guess-input");
      const errBox = document.getElementById("error-msg");
      let val = input.value.trim();
      
      if (!val) return;
      errBox.innerHTML = "";

      let guess = window.FICHES.find(p => nettoyer(p.nomScientifique) === nettoyer(val));

      if (!guess) {
        let meilleurChoix = null;
        let minErreur = Infinity;
        window.FICHES.forEach(p => {
          let err = levenshtein(nettoyer(val), nettoyer(p.nomScientifique));
          if (err < minErreur) { minErreur = err; meilleurChoix = p; }
        });
        if (minErreur <= 4 && meilleurChoix) {
          errBox.innerHTML = `Vouliez-vous dire <span class="correction-link" onclick="appliquerCorrection('${meilleurChoix.nomScientifique}')">${meilleurChoix.nomScientifique}</span> ?`;
        } else errBox.innerText = "Espèce introuvable.";
        return;
      }

      if (historiques.find(h => h.obj.nomScientifique === guess.nomScientifique)) {
        errBox.innerText = "Espèce déjà proposée !"; return;
      }

      tentatives--;
      document.getElementById("essais-restants").innerText = tentatives;
      input.value = "";

      // Calcul des correspondances pour l'avancée de l'arbre
      let shared = 0;
      if (guess.ordre === mystere.ordre) {
        shared = 1;
        if (guess.famille === mystere.famille) {
          shared = 2;
          if (guess.genre === mystere.genre) {
            shared = 3;
            if (guess.nomScientifique === mystere.nomScientifique) shared = 4;
          }
        }
      }

      historiques.push({ obj: guess, highestShared: shared });
      highestMatch = Math.max(highestMatch, shared);

      genererArbre();

      if (highestMatch === 4 || tentatives === 0) {
        const endScreen = document.getElementById("end-screen");
        const endTitle = document.getElementById("end-title");
        const endText = document.getElementById("end-text");
        
        endScreen.style.display = "block";
        input.disabled = true;
        document.getElementById("btn-submit").disabled = true;
        document.getElementById("btn-hint").disabled = true;

        if (highestMatch === 4) {
          endScreen.className = "end-screen victory";
          endTitle.innerText = "🎉 Victoire !";
          endTitle.style.color = "#4ade80";
          endText.innerText = `C'était bien ${mystere.nomScientifique}. (Trouvé en ${MAX_TENTATIVES - tentatives} essai(s))`;
        } else {
          highestMatch = 4; genererArbre(); // Dévoile la solution complète
          endScreen.className = "end-screen defeat";
          endTitle.innerText = "💀 Fin de partie";
          endTitle.style.color = "#f87171";
          endText.innerText = `L'espèce mystère était ${mystere.nomScientifique}.`;
        }
        if (mystere.image) {
          const imgElement = document.getElementById("end-img");
          imgElement.src = mystere.image; imgElement.style.display = "block";
        }
      }
    }

    document.getElementById("guess-input").addEventListener("keypress", (e) => {
      if (e.key === "Enter") jouer();
    });
  </script>
</body>
</html>
