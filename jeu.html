<script>
    // === 1. COLLE TA LISTE window.FICHES ICI ===
    window.FICHES = [
      // Colle ici tout ton tableau de données
    ];

    // Variables de jeu
    let poissonMystere = null;
    let nbIndices = 0;
    let highestMatch = 0;

    // --- NOUVEAU : Outils de correction orthographique ---

    // Fonction pour enlever les accents et mettre en minuscules
    function normaliser(str) {
      if (!str) return "";
      return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
    }

    // Algorithme de Levenshtein : calcule le nombre d'erreurs entre deux mots
    function calculErreurs(a, b) {
      const matrice = [];
      for (let i = 0; i <= b.length; i++) { matrice[i] = [i]; }
      for (let j = 0; j <= a.length; j++) { matrice[0][j] = j; }
      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          if (b.charAt(i - 1) === a.charAt(j - 1)) {
            matrice[i][j] = matrice[i - 1][j - 1];
          } else {
            matrice[i][j] = Math.min(
              matrice[i - 1][j - 1] + 1, // Remplacement
              Math.min(matrice[i][j - 1] + 1, matrice[i - 1][j] + 1) // Insertion ou Suppression
            );
          }
        }
      }
      return matrice[b.length][a.length];
    }

    // ---------------------------------------------------

    function initGame() {
      if (!window.FICHES || window.FICHES.length === 0) return;

      poissonMystere = window.FICHES[Math.floor(Math.random() * window.FICHES.length)];
      console.log("🤫 Cheat: L'animal est " + poissonMystere.nomScientifique);

      const datalist = document.getElementById("liste-poissons");
      window.FICHES.forEach(p => {
        let option = document.createElement("option");
        let label = p.nomScientifique;
        if (p.nomCommun && p.nomCommun !== "Aucun" && p.nomCommun !== "Aucune information") {
          label += ` (${p.nomCommun})`;
        }
        option.value = label; 
        datalist.appendChild(option);
      });
    }

    function appliquerCorrection(nomAcorriger) {
      // Cette fonction est appelée si l'utilisateur clique sur "Vouliez-vous dire..."
      document.getElementById("guess-input").value = nomAcorriger;
      verifierReponse();
    }

    function verifierReponse() {
      const inputField = document.getElementById("guess-input");
      const errorMsg = document.getElementById("error-msg");
      let val = inputField.value.trim();
      if (!val) return;

      let valNorm = normaliser(val);

      // 1. Chercher une correspondance exacte (sans se soucier des accents/majuscules)
      let guess = window.FICHES.find(p => 
        normaliser(p.nomScientifique) === valNorm || 
        normaliser(p.nomCommun) === valNorm ||
        normaliser(`${p.nomScientifique} (${p.nomCommun})`) === valNorm
      );

      // 2. Si pas trouvé, on cherche s'il y a une faute de frappe
      if (!guess) {
        let bestMatch = null;
        let minimumErreurs = Infinity;

        window.FICHES.forEach(p => {
          let errSci = calculErreurs(valNorm, normaliser(p.nomScientifique));
          let errCom = (p.nomCommun && p.nomCommun !== "Aucun") ? calculErreurs(valNorm, normaliser(p.nomCommun)) : Infinity;
          
          let minActuel = Math.min(errSci, errCom);
          if (minActuel < minimumErreurs) {
            minimumErreurs = minActuel;
            bestMatch = p;
          }
        });

        // Si l'erreur est minime (ex: max 3 lettres de différence)
        if (minimumErreurs <= 3 && bestMatch) {
          let nomAffiche = bestMatch.nomScientifique;
          if (bestMatch.nomCommun && bestMatch.nomCommun !== "Aucun" && bestMatch.nomCommun !== "Aucune information") {
            nomAffiche += ` (${bestMatch.nomCommun})`;
          }
          // On propose le bon poisson avec un lien pour l'auto-valider
          errorMsg.innerHTML = `Espèce non reconnue. Vouliez-vous dire <a href="#" onclick="appliquerCorrection('${bestMatch.nomScientifique}'); return false;" style="color: #38bdf8; text-decoration: underline; font-weight: bold;">${nomAffiche}</a> ?`;
        } else {
          errorMsg.textContent = "Espèce introuvable. Vérifie l'orthographe ou utilise la liste déroulante !";
        }
        return;
      }
      
      // Si on arrive ici, le poisson est valide
      errorMsg.textContent = "";
      inputField.value = "";

      let isOrdre = (guess.ordre === poissonMystere.ordre);
      let isFamille = (isOrdre && guess.famille === poissonMystere.famille);
      let isGenre = (isFamille && guess.genre === poissonMystere.genre);
      let isEspece = (guess.id === poissonMystere.id);

      if (isOrdre && highestMatch < 1) { highestMatch = 1; updateTreeUI('tree-ordre', poissonMystere.ordre); }
      if (isFamille && highestMatch < 2) { highestMatch = 2; updateTreeUI('tree-famille', poissonMystere.famille); }
      if (isGenre && highestMatch < 3) { highestMatch = 3; updateTreeUI('tree-genre', poissonMystere.genre); }

      ajouterHistorique(guess, isOrdre, isFamille, isGenre);

      if (isEspece) {
        updateTreeUI('tree-espece', poissonMystere.nomScientifique);
        document.getElementById("btn-submit").disabled = true;
        document.getElementById("guess-input").disabled = true;
        document.getElementById("btn-hint").style.display = "none";
        
        const victoryMsg = document.getElementById("victory-msg");
        victoryMsg.style.display = "block";
        document.getElementById("victory-img").src = "../" + poissonMystere.image;
      }
    }

    function updateTreeUI(elementId, texte) {
      const el = document.getElementById(elementId);
      el.textContent = texte;
      el.classList.remove("hidden");
      el.classList.add("revealed");
    }

    function ajouterHistorique(guess, isOrdre, isFamille, isGenre) {
      const container = document.getElementById("history-list");
      
      const badgeOrdre = `<span class="badge ${isOrdre ? 'badge-match' : 'badge-miss'}">${guess.ordre}</span>`;
      const badgeFamille = `<span class="badge ${isFamille ? 'badge-match' : 'badge-miss'}">${guess.famille}</span>`;
      const badgeGenre = `<span class="badge ${isGenre ? 'badge-match' : 'badge-miss'}">${guess.genre}</span>`;
      
      let nomAffiche = guess.nomScientifique;
      if(guess.nomCommun && guess.nomCommun !== "Aucun" && guess.nomCommun !== "Aucune information") {
        nomAffiche += ` (${guess.nomCommun})`;
      }

      const itemHtml = `
        <div class="history-item">
          <div class="history-title">${nomAffiche}</div>
          <div class="history-ranks">
            ${badgeOrdre} ➔ ${badgeFamille} ➔ ${badgeGenre}
          </div>
        </div>
      `;
      container.insertAdjacentHTML('afterbegin', itemHtml);
    }

    function donnerIndice() {
      const container = document.getElementById("hints-container");
      nbIndices++;

      let text = "";
      if (nbIndices === 1) text = `🌍 Continent : ${poissonMystere.continent}`;
      else if (nbIndices === 2) text = `📍 Pays : ${poissonMystere.pays.join(", ")}`;
      else if (nbIndices === 3) {
        text = `🖼️ Un petit coup d'oeil sur sa photo !`;
        text += `<br><img src="../${poissonMystere.image}" style="max-width:150px; border-radius:8px; margin-top:10px; opacity:0.6;">`;
        document.getElementById("btn-hint").disabled = true;
        document.getElementById("btn-hint").textContent = "Plus d'indices !";
      }

      const p = document.createElement("p");
      p.innerHTML = text;
      container.appendChild(p);
    }

    document.getElementById("guess-input").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        verifierReponse();
      }
    });

    window.onload = initGame;
  </script>
