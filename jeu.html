<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Meta-Aqua - Le Jeu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* --- DESIGN GLOBAL DU SITE --- */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #020617; color: #e5e7eb; min-height: 100vh; overflow-y: auto; }
    .navbar { position: fixed; top: 0; left: 0; width: 100%; min-height: 56px; background: rgba(15, 23, 42, 0.98); border-bottom: 1px solid #1f2937; display: flex; align-items: center; justify-content: space-between; padding: 4px 16px; z-index: 50; }
    .navbar-title { font-size: 0.95rem; font-weight: 600; color: #e5e7eb; }
    .navbar-menu { display: flex; gap: 8px; }
    .nav-btn { border: none; background: transparent; color: #cbd5f5; font-size: 0.8rem; padding: 6px 8px; border-radius: 999px; cursor: pointer; }
    .nav-btn.active { background: #1d4ed8; color: #e5e7eb; }
    .page { padding-top: 72px; padding-left: 12px; padding-right: 12px; padding-bottom: 20px; max-width: 1200px; margin: 0 auto; }
    .card { background: #111827; border-radius: 10px; border: 1px solid #1f2937; padding: 16px; margin-bottom: 14px; }
    h1 { font-size: 1.4rem; color: #38bdf8; margin-bottom: 8px; }

    /* --- UI DU JEU --- */
    .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .compteur { font-size: 0.9rem; font-weight: bold; padding: 4px 10px; background: #1f2937; border-radius: 6px; color: #facc15; border: 1px solid #374151;}
    .input-group { display: flex; gap: 10px; margin-top: 5px; }
    input { flex: 1; padding: 10px; background: #020617; border: 1px solid #374151; border-radius: 6px; color: #e5e7eb; font-size: 1rem;}
    input:focus { border-color: #38bdf8; outline: none; }
    button.btn-play { background: #38bdf8; color: #020617; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button.btn-play:hover { background: #0ea5e9; }
    #error-msg { margin-top: 8px; font-size: 0.9rem; color: #ef4444; text-align: center; }
    .correction-link { color: #38bdf8; text-decoration: underline; cursor: pointer; font-weight: bold; }

    /* =========================================
       LE GRAPHE ARBORESCENT (STYLE METAZOOA)
       ========================================= */
    .tree-container {
      display: flex;
      justify-content: center;
      overflow-x: auto; 
      padding: 20px 20px 40px 20px;
    }

    .tree ul {
      padding-top: 20px;
      position: relative;
      display: flex;
      justify-content: center;
      padding-left: 0;
      margin: 0;
      transition: all 0.5s;
    }

    .tree li {
      display: flex;
      flex-direction: column;
      align-items: center;
      list-style-type: none;
      position: relative;
      padding: 20px 6px 0 6px;
      transition: all 0.5s;
    }

    .tree li::before, .tree li::after {
      content: '';
      position: absolute; top: 0; right: 50%;
      border-top: 3px solid #8b7d6b;
      width: 50%; height: 20px;
    }
    .tree li::after {
      right: auto; left: 50%;
      border-left: 3px solid #8b7d6b;
    }

    .tree li:only-child::after, .tree li:only-child::before { display: none; }
    .tree li:only-child { padding-top: 0; }
    .tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
    
    .tree li:last-child::before { border-right: 3px solid #8b7d6b; border-radius: 0 10px 0 0; }
    .tree li:first-child::after { border-radius: 10px 0 0 0; }

    .tree ul ul::before {
      content: '';
      position: absolute; top: 0; left: 50%;
      border-left: 3px solid #8b7d6b;
      width: 0; height: 20px;
      transform: translateX(-1.5px);
    }

    /* --- STYLES DES BOÎTES --- */
    .node-box {
      padding: 6px 14px;
      border-radius: 6px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      position: relative;
      z-index: 2;
      min-width: 110px;
      text-align: center;
      animation: popIn 0.3s ease-out;
    }

    .node-root { background: #690b0a; color: #fff; border: 2px solid #3a0808; } 
    .node-clade { background: #6b7316; color: #fff; border: 2px solid #4a5010; } 
    .node-leaf { background: #fdfdfd; color: #4a5010; border: 2px solid #6b7316; } 
    .node-unknown { background: #111827; color: #9ca3af; border: 2px dashed #4b5563; box-shadow: none; } 

    .node-rank { font-size: 0.65rem; text-transform: uppercase; margin-bottom: 2px; opacity: 0.8; font-weight: bold;}
    .node-name { font-size: 1rem; font-weight: bold; }
    .node-leaf .node-name { font-style: italic; font-weight: 600; font-size: 0.9rem;} 

    @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    /* --- INDICES ET FIN DE JEU --- */
    .btn-hint { background: #f59e0b; color: #020617; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
    .btn-hint:hover { background: #d97706; }
    .btn-hint:disabled { background: #4b5563; color: #9ca3af; cursor: not-allowed; }
    #hints-container p { background: #1f2937; border-left: 4px solid #f59e0b; padding: 10px; margin-bottom: 8px; border-radius: 4px; font-size: 0.9rem; animation: popIn 0.3s;}
    .end-screen { display: none; margin-top: 15px; padding: 15px; border-radius: 8px; text-align: center; }
    .victory { background: rgba(34, 197, 94, 0.1); border: 1px solid #22c55e; }
    .defeat { background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; }
  </style>

  <script src="especes.js"></script>
</head>
<body>

  <header class="navbar">
    <div class="navbar-title">Espace adhérent</div>
    <div class="navbar-menu"><button class="nav-btn active">Jeu</button></div>
  </header>

  <main class="page">
    
    <div class="card">
      <div class="game-header">
        <h1>Meta-Aqua</h1>
        <div class="compteur">Essais : <span id="essais-restants">30</span></div>
      </div>
      <p style="color:#9ca3af; font-size:0.85rem; margin-bottom: 10px;">Trouve l'espèce mystère. Tes erreurs créeront des branches sur l'arbre phylogénétique.</p>
      
      <div class="input-group">
        <input list="liste-poissons" id="guess-input" placeholder="Tape un nom scientifique..." autocomplete="off">
        <datalist id="liste-poissons"></datalist>
        <button class="btn-play" id="btn-submit" onclick="jouer()">Valider</button>
      </div>
      <div id="error-msg"></div>

      <div id="end-screen" class="end-screen">
        <h2 id="end-title" style="border: none;"></h2>
        <p id="end-text"></p>
        <img id="end-img" src="" alt="Espèce mystère" style="max-width: 100%; border-radius: 8px; margin-top: 10px; display: none; margin-left:auto; margin-right:auto;">
      </div>
    </div>

    <div class="card" style="border:none; background: transparent; padding: 0;">
      <div class="tree-container">
        <div class="tree" id="arbre-dynamique">
          </div>
      </div>
    </div>

    <div class="card">
      <h2>💡 Besoin d'un indice ?</h2>
      <div id="hints-container"></div>
      <button class="btn-hint" onclick="donnerIndice()" id="btn-hint">Révéler un indice</button>
    </div>

  </main>

  <script>
    let mystere = null;
    let tentatives = 30;
    const MAX_TENTATIVES = 30;
    let nbIndices = 0;
    
    let historiques = []; 
    // Niveau d'avancement (0 = Rien trouvé, 1 = Classe, 2 = Ordre, 3 = Famille, 4 = Genre, 5 = Espèce)
    let highestMatch = 0; 
    let treeData = {};

    window.onload = () => {
      if (typeof window.FICHES === "undefined" || window.FICHES.length === 0) {
        document.getElementById("error-msg").innerText = "Erreur : Impossible de charger especes.js.";
        return;
      }

      mystere = window.FICHES[Math.floor(Math.random() * window.FICHES.length)];
      // (Optionnel : commente cette ligne pour ne pas tricher via la console)
      // console.log("Anti-triche : " + mystere.nomScientifique);

      const datalist = document.getElementById("liste-poissons");
      window.FICHES.forEach(p => {
        let option = document.createElement("option");
        option.value = p.nomScientifique;
        datalist.appendChild(option);
      });

      renderTree();
    };

    // --- RÉCUPÉRATION DU CHEMIN COMPLET D'UNE ESPÈCE ---
    // Gère dynamiquement l'ajout futur des mollusques/crustacés
    function getTaxonomyPath(poisson) {
      // Si poisson.classe n'existe pas dans la BDD, on met "Actinopterygii" par défaut
      let classe = poisson.classe ? poisson.classe : "Actinopterygii";
      
      return [
        { rank: "Classe", name: classe },
        { rank: "Ordre", name: poisson.ordre },
        { rank: "Famille", name: poisson.famille },
        { rank: "Genre", name: poisson.genre },
        { rank: "Espèce", name: poisson.nomScientifique }
      ];
    }

    // --- MOTEUR DE RENDU HTML (Génère l'arbre) ---
    function renderTree() {
      // 1. Initialisation de la racine globale (Règne Animal)
      treeData = { name: "Animalia", rank: "Règne", isTarget: true, isUnknown: false, isLeaf: false, children: {} };

      let targetPath = getTaxonomyPath(mystere);

      // 2. On insère le chemin Cible (Le tronc principal) 
      let current = treeData;
      for (let i = 0; i < highestMatch; i++) {
        if (i === 5) break; 
        let nName = targetPath[i].name;
        current.children[nName] = { name: nName, rank: targetPath[i].rank, isTarget: true, isUnknown: false, isLeaf: false, children: {} };
        current = current.children[nName];
      }
      
      // 3. La prochaine boîte cachée "???"
      if (highestMatch < 5) {
        current.children["???"] = { name: "???", rank: targetPath[highestMatch].rank, isTarget: true, isUnknown: true, isLeaf: true, children: {} };
      }

      // 4. On insère toutes les erreurs (branches mortes)
      historiques.forEach(guess => {
        let gPath = getTaxonomyPath(guess);
        let curr = treeData;
        for (let i = 0; i < gPath.length; i++) {
          let nName = gPath[i].name;
          if (!curr.children[nName]) {
             curr.children[nName] = { name: nName, rank: gPath[i].rank, isTarget: false, isUnknown: false, isLeaf: false, children: {} };
          }
          curr = curr.children[nName];
          if (i === 4) curr.isLeaf = true; // Index 4 = Espèce
        }
      });

      // 5. Génération du HTML
      let html = `<ul>` + generateHTML(treeData) + `</ul>`;
      document.getElementById("arbre-dynamique").innerHTML = html;
    }

    // Fonction récursive pour transformer les données en boîtes visuelles
    function generateHTML(node) {
      let boxClass = "";
      if (node.isUnknown) {
        boxClass = "node-unknown"; 
      } else if (node.isLeaf) {
        boxClass = "node-leaf"; // Espèce (blanc)
      } else if (node.rank === "Règne" || node.rank === "Classe") {
        boxClass = "node-root"; // Règne/Classe (rouge)
      } else {
        boxClass = "node-clade"; // Ordre/Fam/Genre (olive)
      }

      let html = `<li>
        <div class="node-box ${boxClass}">
          <div class="node-rank">${node.rank}</div>
          <div class="node-name">${node.name}</div>
        </div>`;

      let childrenKeys = Object.keys(node.children);
      if (childrenKeys.length > 0) {
        // Triage : On force la branche Mystère à rester à droite pour un tronc visuellement droit
        childrenKeys.sort((a, b) => {
          let isTargetA = node.children[a].isTarget ? 1 : 0;
          let isTargetB = node.children[b].isTarget ? 1 : 0;
          return isTargetA - isTargetB; 
        });

        html += `<ul>`;
        for (let key of childrenKeys) {
          html += generateHTML(node.children[key]);
        }
        html += `</ul>`;
      }
      html += `</li>`;
      return html;
    }

    // --- CORRECTION ORTHOGRAPHIQUE ---
    function nettoyer(str) { return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim(); }
    function levenshtein(a, b) {
      const mat = [];
      for (let i = 0; i <= b.length; i++) mat[i] = [i];
      for (let j = 0; j <= a.length; j++) mat[0][j] = j;
      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          if (b.charAt(i-1) === a.charAt(j-1)) mat[i][j] = mat[i-1][j-1];
          else mat[i][j] = Math.min(mat[i-1][j-1]+1, Math.min(mat[i][j-1]+1, mat[i-1][j]+1));
        }
      }
      return mat[b.length][a.length];
    }
    function appliquerCorrection(nom) { document.getElementById("guess-input").value = nom; jouer(); }

    // --- INDICES ---
    function donnerIndice() {
      const container = document.getElementById("hints-container");
      const btnHint = document.getElementById("btn-hint");
      nbIndices++;
      let text = "";
      if (nbIndices === 1) text = `🌍 <strong>Continent :</strong> ${mystere.continent || "Inconnu"}`;
      else if (nbIndices === 2) text = `📍 <strong>Pays :</strong> ${mystere.pays ? mystere.pays.join(", ") : "Inconnu"}`;
      else if (nbIndices === 3) {
        text = `🖼️ <strong>Aperçu :</strong><br><img src="${mystere.image || ''}" style="max-width:200px; margin-top:5px; border-radius:6px; filter:blur(4px);">`;
        btnHint.disabled = true;
        btnHint.innerText = "Tous les indices sont utilisés";
      }
      container.innerHTML += `<p>${text}</p>`;
    }

    // --- LOGIQUE DE JEU ---
    function jouer() {
      if (!window.FICHES || tentatives <= 0) return;
      const input = document.getElementById("guess-input");
      const errBox = document.getElementById("error-msg");
      let val = input.value.trim();
      if (!val) return;
      errBox.innerHTML = "";

      let guess = window.FICHES.find(p => nettoyer(p.nomScientifique) === nettoyer(val));

      // Correcteur orthographique
      if (!guess) {
        let best = null; let minErr = Infinity;
        window.FICHES.forEach(p => {
          let err = levenshtein(nettoyer(val), nettoyer(p.nomScientifique));
          if (err < minErr) { minErr = err; best = p; }
        });
        if (minErr <= 4 && best) errBox.innerHTML = `Vouliez-vous dire <span class="correction-link" onclick="appliquerCorrection('${best.nomScientifique}')">${best.nomScientifique}</span> ?`;
        else errBox.innerText = "Espèce introuvable dans la base.";
        return;
      }

      if (historiques.find(h => h.nomScientifique === guess.nomScientifique)) {
        errBox.innerText = "Tu as déjà proposé cette espèce !";
        return;
      }

      tentatives--;
      document.getElementById("essais-restants").innerText = tentatives;
      input.value = "";

      let gPath = getTaxonomyPath(guess);
      let mPath = getTaxonomyPath(mystere);
      
      let shared = 0; // Niveau atteint (Commence à 0 car "Animalia" est toujours bon)
      
      // On compare chaque niveau (0=Classe, 1=Ordre, 2=Famille, 3=Genre, 4=Espèce)
      if (gPath[0].name === mPath[0].name) {
        shared = 1;
        if (gPath[1].name === mPath[1].name) {
          shared = 2;
          if (gPath[2].name === mPath[2].name) {
            shared = 3;
            if (gPath[3].name === mPath[3].name) {
              shared = 4;
              if (gPath[4].name === mPath[4].name) shared = 5;
            }
          }
        }
      }

      historiques.push(guess);
      highestMatch = Math.max(highestMatch, shared);

      renderTree();

      // Fin de partie
      if (shared === 5 || tentatives === 0) {
        document.getElementById("end-screen").style.display = "block";
        document.getElementById("btn-submit").disabled = true;
        input.disabled = true;
        document.getElementById("btn-hint").disabled = true;
        
        const title = document.getElementById("end-title");
        const txt = document.getElementById("end-text");
        const img = document.getElementById("end-img");

        if (shared === 5) {
          document.getElementById("end-screen").className = "end-screen victory";
          title.innerText = "🎉 Gagné !";
          title.style.color = "#4ade80";
          txt.innerText = `C'était bien ${mystere.nomScientifique} (trouvé en ${MAX_TENTATIVES - tentatives} essai(s)).`;
        } else {
          highestMatch = 5; // Révélation complète
          renderTree(); 
          document.getElementById("end-screen").className = "end-screen defeat";
          title.innerText = "💀 Perdu...";
          title.style.color = "#ef4444";
          txt.innerText = `Tu n'as plus d'essais. La réponse était : ${mystere.nomScientifique}.`;
        }
        
        if (mystere.image) {
          img.src = mystere.image;
          img.style.display = "block";
        }
      }
    }

    document.getElementById("guess-input").addEventListener("keypress", e => { if (e.key === "Enter") jouer(); });
  </script>
</body>
</html>
