<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Emploi du temps Serre</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #020617;
      color: #e5e7eb;
      min-height: 100vh;
    }
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      min-height: 56px;
      background: rgba(15, 23, 42, 0.98);
      border-bottom: 1px solid #1f2937;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 16px;
      z-index: 50;
      flex-wrap: wrap;
      gap: 4px;
    }
    .navbar-left { display: flex; align-items: center; gap: 10px; }
    .navbar-title { font-size: 0.95rem; font-weight: 600; color: #e5e7eb; }
    .navbar-user { font-size: 0.8rem; color: #9ca3af; }
    .navbar-menu { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .nav-btn { border: none; background: transparent; color: #cbd5f5; font-size: 0.8rem; padding: 6px 8px; border-radius: 999px; cursor: pointer; display: flex; align-items: center; gap: 4px; position: relative; }
    .nav-btn span.icon { font-size: 1rem; position: relative; }
    .nav-btn.active { background: #1d4ed8; color: #e5e7eb; }
    .nav-btn:hover { background: #111827; }
    .navbar-logout { border-radius: 999px; border: 1px solid #374151; background: #111827; color: #e5e7eb; padding: 5px 10px; font-size: 0.8rem; cursor: pointer; }
    .navbar-logout:hover { background: #1f2937; }
    .page { padding-top: 72px; padding-left: 12px; padding-right: 12px; padding-bottom: 20px; max-width: 1200px; margin: 0 auto; }
    .card { background: #020617; border-radius: 10px; border: 1px solid #1f2937; padding: 14px 16px; margin-bottom: 14px; }
    .card h1 { font-size: 1.4rem; margin-bottom: 6px; color: #38bdf8; }
    .card h2 { font-size: 1.05rem; margin-bottom: 6px; color: #e5e7eb; }
    .card p { font-size: 0.85rem; color: #d1d5db; }
    .subtitle { font-size: 0.85rem; color: #9ca3af; margin-bottom: 12px; }
    .small-note { font-size: 0.75rem; color: #9ca3af; margin-top: 4px; }
    
    .controls { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    .controls input, .controls select, .controls button { padding: 8px 12px; border-radius: 6px; border: 1px solid #1f2937; background: #111827; color: #e5e7eb; font-size: 0.85rem; }
    .controls input { flex: 1; min-width: 150px; }
    .controls select { min-width: 120px; }
    .btn { background: #1d4ed8; border: none; color: #e5e7eb; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 500; transition: all 0.2s; }
    .btn:hover { background: #2563eb; }
    .btn:disabled { background: #374151; cursor: not-allowed; opacity: 0.5; }
    .btn-danger { background: #991b1b; }
    .btn-danger:hover { background: #b91c1c; }
    
    .calendar-wrapper { overflow-x: auto; margin-bottom: 16px; }
    .calendar { width: 100%; border-collapse: collapse; background: #111827; border-radius: 8px; overflow: hidden; border: 1px solid #1f2937; }
    .calendar thead { background: #1f2937; }
    .calendar th { padding: 12px; text-align: left; font-weight: 600; color: #e5e7eb; border-bottom: 1px solid #1f2937; }
    .calendar td { padding: 12px; border-bottom: 1px solid #1f2937; font-size: 0.85rem; }
    .calendar tbody tr:hover { background: #1a2332; }
    
    .slot-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 6px; border: 1px solid #1f2937; background: #111827; margin-bottom: 8px; gap: 8px; }
    .slot-item:hover { border-color: #1d4ed8; background: #1a2332; }
    .slot-info { flex: 1; min-width: 0; }
    .slot-date { font-weight: 600; color: #38bdf8; }
    .slot-time { font-size: 0.78rem; color: #9ca3af; }
    .slot-member { font-size: 0.8rem; color: #d1d5db; }
    .slot-actions { display: flex; gap: 6px; }
    .slot-actions button { padding: 4px 8px; font-size: 0.75rem; }
    
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: 100; align-items: center; justify-content: center; }
    .modal.active { display: flex; }
    .modal-content { background: #020617; border: 1px solid #1f2937; border-radius: 10px; padding: 20px; max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto; }
    .modal-header { font-size: 1.2rem; font-weight: 600; color: #38bdf8; margin-bottom: 16px; }
    .modal-body { display: flex; flex-direction: column; gap: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.85rem; font-weight: 500; color: #d1d5db; }
    .form-group input, .form-group select, .form-group textarea { padding: 8px 12px; border-radius: 6px; border: 1px solid #1f2937; background: #111827; color: #e5e7eb; font-size: 0.85rem; font-family: inherit; }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .modal-footer { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
    .modal-footer button { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: 500; }
    .modal-footer .btn-primary { background: #1d4ed8; color: #e5e7eb; }
    .modal-footer .btn-primary:hover { background: #2563eb; }
    .modal-footer .btn-secondary { background: #374151; color: #e5e7eb; }
    .modal-footer .btn-secondary:hover { background: #4b5563; }
    
    .alert { padding: 12px 16px; border-radius: 6px; margin-bottom: 12px; font-size: 0.85rem; }
    .alert-success { background: rgba(34, 197, 94, 0.1); color: #22c55e; border: 1px solid #22c55e; }
    .alert-error { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid #ef4444; }
    .alert-info { background: rgba(59, 130, 246, 0.1); color: #3b82f6; border: 1px solid #3b82f6; }
    
    @media (max-width: 768px) { .page { padding-top: 90px; } .controls { flex-direction: column; } }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="navbar-left">
      <div>
        <div class="navbar-title">Espace adhérent</div>
        <div class="navbar-user" id="navbarUser">Non connecté</div>
      </div>
    </div>
    <div class="navbar-menu">
      <button class="nav-btn" data-link="index.html"><span class="icon">🏠</span><span>Accueil</span></button>
      <button class="nav-btn" data-link="serre.html" data-requires-serre="1"><span class="icon">🌱</span><span>Serre</span></button>
      <button class="nav-btn active" data-link="emploi-serre.html"><span class="icon">📅</span><span>Emploi</span></button>
      <button class="navbar-logout" id="logoutBtn">Déconnexion</button>
    </div>
  </header>

  <main class="page">
    <div class="card">
      <h1>📅 Emploi du temps Serre</h1>
      <p class="subtitle">Gère les créneaux horaires de la serre.</p>
    </div>

    <div id="alertContainer"></div>

    <div class="card">
      <h2>➕ Ajouter un créneau</h2>
      <div class="controls">
        <input type="date" id="slotDate" placeholder="Date">
        <input type="time" id="slotTimeStart" placeholder="Heure début">
        <input type="time" id="slotTimeEnd" placeholder="Heure fin">
        <select id="slotMember">
          <option value="">Membre</option>
        </select>
        <button class="btn" id="addSlotBtn">Ajouter</button>
      </div>
    </div>

    <div class="card">
      <h2>📋 Créneaux existants</h2>
      <div id="slotsList"></div>
    </div>
  </main>

  <!-- Modal édition -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <div class="modal-header">Modifier le créneau</div>
      <div class="modal-body">
        <div class="form-group">
          <label for="editDate">Date</label>
          <input type="date" id="editDate">
        </div>
        <div class="form-group">
          <label for="editTimeStart">Heure début</label>
          <input type="time" id="editTimeStart">
        </div>
        <div class="form-group">
          <label for="editTimeEnd">Heure fin</label>
          <input type="time" id="editTimeEnd">
        </div>
        <div class="form-group">
          <label for="editMember">Membre</label>
          <select id="editMember"></select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeEditModal()">Annuler</button>
        <button class="btn-primary" id="saveEditBtn">Sauvegarder</button>
      </div>
    </div>
  </div>

  <script>
    const storedUser = localStorage.getItem("user");
    let currentUser = null;
    
    if (!storedUser) {
      console.log("Mode démo");
    } else {
      try {
        currentUser = JSON.parse(storedUser);
      } catch (e) {
        console.log("Erreur parsing utilisateur");
      }
    }

    if (!currentUser || (currentUser.role !== "admin" && currentUser.serre !== true)) {
      window.location.href = "index.html";
    }

    const navbarUser = document.getElementById('navbarUser');
    if (currentUser && currentUser.username) {
      const roleLabel = currentUser.role === "admin" ? "Admin" : "Serre";
      navbarUser.textContent = currentUser.username + " (" + roleLabel + ")";
    }

    document.querySelectorAll(".nav-btn[data-link]").forEach(btn => {
      btn.addEventListener("click", () => {
        window.location.href = btn.dataset.link;
      });
    });

    const logoutBtn = document.getElementById('logoutBtn');
    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem("user");
      window.location.href = "login.html";
    });

    const SERRE_SLOTS_KEY = "serreSlots";
    const slotsList = document.getElementById("slotsList");
    const alertContainer = document.getElementById("alertContainer");
    let editingSlotId = null;

    // Charger liste des membres
    async function loadMembers() {
      try {
        const res = await fetch('/api/users');
        if (!res.ok) throw new Error('Erreur');
        const users = await res.json();
        
        const memberSelects = [document.getElementById('slotMember'), document.getElementById('editMember')];
        memberSelects.forEach(select => {
          select.innerHTML = '<option value="">-- Sélectionner --</option>';
          users.forEach(user => {
            const option = document.createElement('option');
            option.value = user.username;
            option.textContent = user.username;
            select.appendChild(option);
          });
        });
      } catch (e) {
        console.log("Pas de serveur, mode local");
        // Mode démo local
        const demoMembers = ['Alice', 'Bob', 'Charlie', 'Diana'];
        const memberSelects = [document.getElementById('slotMember'), document.getElementById('editMember')];
        memberSelects.forEach(select => {
          select.innerHTML = '<option value="">-- Sélectionner --</option>';
          demoMembers.forEach(member => {
            const option = document.createElement('option');
            option.value = member;
            option.textContent = member;
            select.appendChild(option);
          });
        });
      }
    }

    // Charger créneaux depuis serveur
    async function loadSerreSlots() {
      try {
        const res = await fetch('/api/serre-slots');
        if (!res.ok) throw new Error('Erreur');
        const slots = await res.json();
        localStorage.setItem(SERRE_SLOTS_KEY, JSON.stringify(slots));
        renderSlots(slots);
      } catch (e) {
        const raw = localStorage.getItem(SERRE_SLOTS_KEY);
        const slots = raw ? JSON.parse(raw) : [];
        renderSlots(slots);
      }
    }

    // Afficher créneaux
    function renderSlots(slots) {
      if (!slots || slots.length === 0) {
        slotsList.innerHTML = '<p class="small-note">Aucun créneau. Ajoute-en un!</p>';
        return;
      }

      const sorted = slots.sort((a, b) => new Date(a.date) - new Date(b.date));
      slotsList.innerHTML = sorted.map(slot => {
        const d = new Date(slot.date);
        const dateStr = d.toLocaleDateString('fr-FR', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
        return `
          <div class="slot-item">
            <div class="slot-info">
              <div class="slot-date">${dateStr}</div>
              <div class="slot-time">${slot.heure_debut} → ${slot.heure_fin}</div>
              <div class="slot-member">👤 ${slot.membre}</div>
            </div>
            <div class="slot-actions">
              <button class="btn" onclick="editSlot('${slot.id}')">✏️</button>
              <button class="btn btn-danger" onclick="deleteSlot('${slot.id}')">🗑️</button>
            </div>
          </div>
        `;
      }).join("");
    }

    // Ajouter créneau
    document.getElementById('addSlotBtn').addEventListener('click', async () => {
      const date = document.getElementById('slotDate').value;
      const timeStart = document.getElementById('slotTimeStart').value;
      const timeEnd = document.getElementById('slotTimeEnd').value;
      const membre = document.getElementById('slotMember').value;

      if (!date || !timeStart || !timeEnd || !membre) {
        showAlert('Tous les champs sont obligatoires', 'error');
        return;
      }

      const slot = {
        date,
        heure_debut: timeStart,
        heure_fin: timeEnd,
        membre
      };

      try {
        const res = await fetch('/api/serre-slots', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(slot)
        });

        if (!res.ok) throw new Error('Erreur serveur');
        
        showAlert('Créneau ajouté avec succès!', 'success');
        document.getElementById('slotDate').value = '';
        document.getElementById('slotTimeStart').value = '';
        document.getElementById('slotTimeEnd').value = '';
        document.getElementById('slotMember').value = '';
        
        await loadSerreSlots();
      } catch (e) {
        // Mode local
        const id = 'slot_' + Date.now();
        slot.id = id;
        const slots = JSON.parse(localStorage.getItem(SERRE_SLOTS_KEY) || '[]');
        slots.push(slot);
        localStorage.setItem(SERRE_SLOTS_KEY, JSON.stringify(slots));
        
        showAlert('Créneau ajouté (mode local)', 'success');
        document.getElementById('slotDate').value = '';
        document.getElementById('slotTimeStart').value = '';
        document.getElementById('slotTimeEnd').value = '';
        document.getElementById('slotMember').value = '';
        
        renderSlots(slots);
      }
    });

    // Éditer créneau
    window.editSlot = async (id) => {
      const slots = JSON.parse(localStorage.getItem(SERRE_SLOTS_KEY) || '[]');
      const slot = slots.find(s => s.id === id);
      
      if (!slot) return;

      editingSlotId = id;
      document.getElementById('editDate').value = slot.date;
      document.getElementById('editTimeStart').value = slot.heure_debut;
      document.getElementById('editTimeEnd').value = slot.heure_fin;
      document.getElementById('editMember').value = slot.membre;

      document.getElementById('editModal').classList.add('active');
    };

    // Fermer modal
    window.closeEditModal = () => {
      document.getElementById('editModal').classList.remove('active');
      editingSlotId = null;
    };

    // Sauvegarder édition
    document.getElementById('saveEditBtn').addEventListener('click', async () => {
      const date = document.getElementById('editDate').value;
      const timeStart = document.getElementById('editTimeStart').value;
      const timeEnd = document.getElementById('editTimeEnd').value;
      const membre = document.getElementById('editMember').value;

      if (!date || !timeStart || !timeEnd || !membre) {
        showAlert('Tous les champs sont obligatoires', 'error');
        return;
      }

      try {
        const res = await fetch(`/api/serre-slots/${editingSlotId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ date, heure_debut: timeStart, heure_fin: timeEnd, membre })
        });

        if (!res.ok) throw new Error('Erreur serveur');
        
        showAlert('Créneau mis à jour!', 'success');
        closeEditModal();
        await loadSerreSlots();
      } catch (e) {
        // Mode local
        const slots = JSON.parse(localStorage.getItem(SERRE_SLOTS_KEY) || '[]');
        const slot = slots.find(s => s.id === editingSlotId);
        if (slot) {
          slot.date = date;
          slot.heure_debut = timeStart;
          slot.heure_fin = timeEnd;
          slot.membre = membre;
          localStorage.setItem(SERRE_SLOTS_KEY, JSON.stringify(slots));
          
          showAlert('Créneau mis à jour (mode local)', 'success');
          closeEditModal();
          renderSlots(slots);
        }
      }
    });

    // Supprimer créneau
    window.deleteSlot = async (id) => {
      if (!confirm('Êtes-vous sûr?')) return;

      try {
        const res = await fetch(`/api/serre-slots/${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error('Erreur');
        
        showAlert('Créneau supprimé!', 'success');
        await loadSerreSlots();
      } catch (e) {
        // Mode local
        const slots = JSON.parse(localStorage.getItem(SERRE_SLOTS_KEY) || '[]');
        const filtered = slots.filter(s => s.id !== id);
        localStorage.setItem(SERRE_SLOTS_KEY, JSON.stringify(filtered));
        
        showAlert('Créneau supprimé (mode local)', 'success');
        renderSlots(filtered);
      }
    };

    // Afficher alerte
    function showAlert(message, type = 'info') {
      const alert = document.createElement('div');
      alert.className = `alert alert-${type}`;
      alert.textContent = message;
      alertContainer.innerHTML = '';
      alertContainer.appendChild(alert);
      
      setTimeout(() => alert.remove(), 4000);
    }

    // Initialisation
    loadMembers();
    loadSerreSlots();
  </script>
</body>
</html>
