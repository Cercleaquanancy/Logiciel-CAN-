<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Emploi du Temps - Serre</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #020617;
      color: #e5e7eb;
      min-height: 100vh;
    }
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      min-height: 56px;
      background: rgba(15, 23, 42, 0.98);
      border-bottom: 1px solid #1f2937;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 16px;
      z-index: 50;
      flex-wrap: wrap;
      gap: 4px;
    }
    .navbar-left { display: flex; align-items: center; gap: 10px; }
    .navbar-title { font-size: 0.95rem; font-weight: 600; color: #e5e7eb; }
    .navbar-user { font-size: 0.8rem; color: #9ca3af; }
    .navbar-menu { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .nav-btn { border: none; background: transparent; color: #cbd5f5; font-size: 0.8rem; padding: 6px 8px; border-radius: 999px; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .nav-btn span.icon { font-size: 1rem; }
    .nav-btn.active { background: #1d4ed8; color: #e5e7eb; }
    .nav-btn:hover { background: #111827; }
    .navbar-logout { border-radius: 999px; border: 1px solid #374151; background: #111827; color: #e5e7eb; padding: 5px 10px; font-size: 0.8rem; cursor: pointer; }
    .navbar-logout:hover { background: #1f2937; }
    .page { padding-top: 72px; padding-left: 12px; padding-right: 12px; padding-bottom: 20px; max-width: 1400px; margin: 0 auto; }
    .card { background: #020617; border-radius: 10px; border: 1px solid #1f2937; padding: 14px 16px; margin-bottom: 14px; }
    .card h1 { font-size: 1.4rem; margin-bottom: 6px; color: #38bdf8; }
    .card h2 { font-size: 1.05rem; margin-bottom: 6px; color: #e5e7eb; }
    .card p { font-size: 0.85rem; color: #d1d5db; }
    .subtitle { font-size: 0.85rem; color: #9ca3af; margin-bottom: 12px; }
    .view-controls { display: flex; gap: 8px; margin-bottom: 12px; }
    .view-btn { padding: 6px 12px; border: 1px solid #1f2937; background: #111827; color: #cbd5f5; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
    .view-btn.active { background: #1d4ed8; color: #e5e7eb; border-color: #1d4ed8; }
    .view-btn:hover { background: #1f2937; }
    .month-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 8px 12px; background: #111827; border-radius: 8px; border: 1px solid #1f2937; }
    .month-nav button { border: none; background: #1d4ed8; color: white; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
    .month-nav button:hover { background: #1e40af; }
    .month-title { font-weight: 600; color: #e5e7eb; }
    .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 14px; }
    .weekday { font-weight: 600; color: #38bdf8; text-align: center; padding: 8px; font-size: 0.85rem; }
    .day-cell { min-height: 80px; padding: 8px; background: #111827; border: 1px solid #1f2937; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
    .day-cell:hover { border-color: #1d4ed8; background: #1a1f2e; }
    .day-cell.other-month { opacity: 0.3; }
    .day-cell.today { border: 2px solid #1d4ed8; }
    .day-number { font-weight: 600; margin-bottom: 4px; font-size: 0.9rem; }
    .day-slots { font-size: 0.7rem; color: #9ca3af; max-height: 50px; overflow: hidden; }
    .slot-badge { display: inline-block; background: #38bdf8; color: #020617; padding: 2px 4px; border-radius: 3px; margin: 2px 0; font-size: 0.65rem; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .month-view { display: block; }
    .month-view.hidden { display: none; }
    .week-view { display: none; overflow-x: auto; }
    .week-view.active { display: block; }
    .week-table { width: 100%; border-collapse: collapse; background: #111827; border: 1px solid #1f2937; border-radius: 8px; overflow: hidden; }
    .week-table thead { background: #1a1f2e; }
    .week-table th { padding: 8px; text-align: center; border: 1px solid #1f2937; font-weight: 600; color: #38bdf8; font-size: 0.85rem; }
    .week-table td { padding: 8px; border: 1px solid #1f2937; text-align: left; font-size: 0.8rem; vertical-align: top; min-width: 120px; }
    .week-table tbody tr:hover { background: #1f2937; }
    .slot-item { background: #38bdf8; color: #020617; padding: 4px 6px; border-radius: 4px; margin: 2px 0; font-weight: 500; font-size: 0.75rem; cursor: pointer; }
    .slot-item:hover { background: #0ea5e9; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: 100; justify-content: center; align-items: center; }
    .modal.active { display: flex; }
    .modal-content { background: #020617; border: 1px solid #1f2937; border-radius: 10px; padding: 20px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; position: relative; }
    .modal-header { font-size: 1.2rem; font-weight: 600; color: #38bdf8; margin-bottom: 12px; }
    .modal-body { color: #d1d5db; font-size: 0.85rem; margin-bottom: 12px; }
    .modal-info { background: #111827; padding: 8px 12px; border-radius: 6px; margin: 6px 0; border-left: 3px solid #1d4ed8; }
    .modal-info strong { color: #38bdf8; }
    .btn-group { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .btn { flex: 1; min-width: 100px; padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: all 0.2s; }
    .btn-primary { background: #1d4ed8; color: white; }
    .btn-primary:hover { background: #1e40af; }
    .btn-secondary { background: #111827; color: #cbd5f5; border: 1px solid #1f2937; }
    .btn-secondary:hover { background: #1f2937; }
    .btn-participate { background: #22c55e; color: white; }
    .btn-participate:hover { background: #16a34a; }
    .btn-close { position: absolute; top: 12px; right: 12px; background: transparent; color: #9ca3af; border: none; font-size: 1.2rem; cursor: pointer; }
    .btn-close:hover { color: #e5e7eb; }
    .form-group { margin-bottom: 12px; }
    .form-label { display: block; font-size: 0.8rem; font-weight: 600; color: #cbd5f5; margin-bottom: 4px; }
    .form-control { width: 100%; padding: 6px 8px; border: 1px solid #1f2937; background: #111827; color: #e5e7eb; border-radius: 4px; font-size: 0.8rem; }
    .form-control:focus { outline: none; border-color: #1d4ed8; box-shadow: 0 0 0 2px rgba(29, 78, 216, 0.2); }
    .alert { padding: 12px 16px; border-radius: 6px; margin-bottom: 12px; font-size: 0.85rem; }
    .alert-success { background: rgba(34, 197, 94, 0.1); color: #22c55e; border: 1px solid #22c55e; }
    .alert-error { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid #ef4444; }
    @media (max-width: 768px) {
      .page { padding-top: 90px; }
      .calendar { grid-template-columns: repeat(7, 1fr); }
      .day-cell { min-height: 60px; }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="navbar-left">
      <div>
        <div class="navbar-title">Espace adhérent</div>
        <div class="navbar-user" id="navbarUser">Non connecté</div>
      </div>
    </div>
    <div class="navbar-menu" id="navbarMenu">
      <button class="nav-btn" data-link="index.html"><span class="icon">🏠</span><span>Accueil</span></button>
      <button class="nav-btn" data-link="fiche.html"><span class="icon">📄</span><span>Fiche</span></button>
      <button class="nav-btn" data-link="aquarium.html"><span class="icon">🐟</span><span>Aquarium</span></button>
      <button class="nav-btn active" data-link="serre.html" data-requires-serre="1"><span class="icon">🌱</span><span>Serre</span></button>
      <button class="nav-btn" data-link="calcule.html"><span class="icon">📐</span><span>Calcule</span></button>
      <button class="nav-btn" data-link="echange.html"><span class="icon">💬</span><span>Échange</span></button>
      <button class="nav-btn" data-link="population.html"><span class="icon">👥</span><span>Population</span></button>
      <button class="nav-btn" data-link="bureau.html" data-requires-bureau="1"><span class="icon">🏛️</span><span>Bureau</span></button>
      <button class="navbar-logout" id="logoutBtn">Déconnexion</button>
    </div>
  </header>

  <main class="page">
    <div class="card">
      <h1>🌱 Emploi du Temps - Serre</h1>
      <p class="subtitle">Gère les créneaux horaires de la serre</p>
      
      <div id="alertContainer"></div>

      <div class="view-controls">
        <button class="view-btn active" id="viewMonth">📅 Mois</button>
        <button class="view-btn" id="viewWeek">📊 Semaine</button>
      </div>

      <div id="monthView" class="month-view active">
        <div class="month-nav">
          <button id="prevMonth">← Mois précédent</button>
          <div class="month-title" id="monthTitle">Janvier 2026</div>
          <button id="nextMonth">Mois suivant →</button>
        </div>
        <div class="calendar" id="monthCalendar"></div>
      </div>

      <div id="weekView" class="week-view">
        <div class="month-nav">
          <button id="prevWeek">← Semaine précédente</button>
          <div class="month-title" id="weekTitle">Semaine</div>
          <button id="nextWeek">Semaine suivante →</button>
        </div>
        <table class="week-table">
          <thead><tr id="weekHeader"></tr></thead>
          <tbody id="weekBody"></tbody>
        </table>
      </div>
    </div>

    <div class="card" id="addSlotCard" style="display: none;">
      <h2>➕ Ajouter un Créneau</h2>
      <p class="subtitle">Enregistrez votre disponibilité</p>
      <form id="addSlotForm">
        <div class="form-group">
          <label class="form-label">Date</label>
          <input type="date" id="slotDate" class="form-control" required>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
          <div class="form-group">
            <label class="form-label">Heure début</label>
            <input type="time" id="slotTimeStart" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label">Heure fin</label>
            <input type="time" id="slotTimeEnd" class="form-control" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Enregistrer le créneau</button>
      </form>
    </div>
  </main>

  <div class="modal" id="slotModal">
    <div class="modal-content">
      <button class="btn-close" onclick="closeSlotModal()">✕</button>
      <div class="modal-header">Détails du Créneau</div>
      <div class="modal-body" id="slotModalBody"></div>
      <div class="btn-group">
        <button class="btn btn-participate" id="participateBtn" onclick="participateSlot()" style="display: none;">✅ Participer</button>
        <button class="btn btn-primary" id="editBtn" onclick="editSlot()" style="display: none;">✏️ Modifier</button>
        <button class="btn btn-primary btn-danger" id="deleteBtn" onclick="deleteSlot()" style="display: none; background: #991b1b;">🗑️ Supprimer</button>
        <button class="btn btn-secondary" onclick="closeSlotModal()">Fermer</button>
      </div>
    </div>
  </div>

  <script>
    const storedUser = localStorage.getItem("user");
    let currentUser = null;
    
    if (storedUser) {
      try {
        currentUser = JSON.parse(storedUser);
      } catch (e) {
        window.location.href = "index.html";
      }
    }

    if (!currentUser || (currentUser.role !== "admin" && currentUser.serre !== true)) {
      window.location.href = "index.html";
    }

    document.getElementById('navbarUser').textContent = currentUser.username + " (" + (currentUser.role === "admin" ? "Admin" : "Serre") + ")";

    document.querySelectorAll(".nav-btn[data-link]").forEach(btn => {
      btn.addEventListener("click", () => {
        window.location.href = btn.dataset.link;
      });
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem("user");
      window.location.href = "index.html";
    });

    document.getElementById("addSlotCard").style.display = "block";

    let currentViewDate = new Date();
    let allSlots = [];
    let selectedSlot = null;

    function showAlert(message, type = 'success') {
      const container = document.getElementById('alertContainer');
      const alert = document.createElement('div');
      alert.className = `alert alert-${type}`;
      alert.textContent = message;
      container.innerHTML = '';
      container.appendChild(alert);
      setTimeout(() => alert.remove(), 4000);
    }

    async function loadSlots() {
      try {
        const res = await fetch('/api/serre-slots');
        if (!res.ok) throw new Error('Erreur réseau');
        let rawSlots = await res.json();
        
        allSlots = rawSlots.map(s => {
          let dateStr = s.date;
          if (dateStr.includes('T')) {
            dateStr = dateStr.substring(0, 10);
          }
          return {
            ...s,
            date: dateStr,
            heure_debut: typeof s.heure_debut === 'string' ? s.heure_debut.substring(0, 5) : s.heure_debut,
            heure_fin: typeof s.heure_fin === 'string' ? s.heure_fin.substring(0, 5) : s.heure_fin
          };
        });
        
        console.log('✅ Créneaux chargés:', allSlots);
        renderMonth();
        renderWeek();
      } catch (e) {
        console.log("Mode local:", e);
        const raw = localStorage.getItem("serreSlots");
        allSlots = raw ? JSON.parse(raw) : [];
        renderMonth();
        renderWeek();
      }
    }

    function renderMonth() {
      const year = currentViewDate.getFullYear();
      const month = currentViewDate.getMonth();
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const daysInMonth = lastDay.getDate();
      const startingDayOfWeek = firstDay.getDay();

      document.getElementById('monthTitle').textContent = currentViewDate.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });

      const weekdays = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'];
      let html = weekdays.map(day => `<div class="weekday">${day}</div>`).join('');

      for (let i = 0; i < startingDayOfWeek; i++) {
        html += '<div class="day-cell other-month"><div class="day-number">-</div></div>';
      }

      const today = new Date();
      for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(year, month, day);
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const slotsForDay = allSlots.filter(s => s.date === dateStr);
        const isToday = date.toDateString() === today.toDateString();

        html += `<div class="day-cell ${isToday ? 'today' : ''}" onclick="showDaySlots('${dateStr}')">
          <div class="day-number">${day}</div>
          <div class="day-slots">
            ${slotsForDay.map(s => `<div class="slot-badge">${s.membre}: ${s.heure_debut}</div>`).join('')}
          </div>
        </div>`;
      }

      const totalCells = Math.ceil((daysInMonth + startingDayOfWeek) / 7) * 7;
      for (let day = 1; day <= totalCells - daysInMonth - startingDayOfWeek; day++) {
        html += '<div class="day-cell other-month"><div class="day-number">-</div></div>';
      }

      document.getElementById('monthCalendar').innerHTML = html;
    }

    function renderWeek() {
      const weekStart = new Date(currentViewDate);
      weekStart.setDate(currentViewDate.getDate() - currentViewDate.getDay());
      const weekEnd = new Date(weekStart);
      weekEnd.setDate(weekStart.getDate() + 6);

      document.getElementById('weekTitle').textContent = `Semaine du ${weekStart.toLocaleDateString('fr-FR')} - ${weekEnd.toLocaleDateString('fr-FR')}`;

      let headerHtml = '<th>Heure</th>';
      for (let i = 0; i < 7; i++) {
        const date = new Date(weekStart);
        date.setDate(weekStart.getDate() + i);
        const dayName = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'][date.getDay()];
        headerHtml += `<th>${dayName}<br>${date.getDate()}/${date.getMonth() + 1}</th>`;
      }
      document.getElementById('weekHeader').innerHTML = headerHtml;

      let bodyHtml = '';
      for (let hour = 6; hour < 22; hour++) {
        const timeStr = `${hour.toString().padStart(2, '0')}:00`;
        bodyHtml += `<tr><td>${timeStr}</td>`;

        for (let day = 0; day < 7; day++) {
          const date = new Date(weekStart);
          date.setDate(weekStart.getDate() + day);
          const year = date.getFullYear();
          const month = date.getMonth();
          const dayNum = date.getDate();
          const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
          const slotsForTime = allSlots.filter(s => s.date === dateStr && s.heure_debut <= timeStr && s.heure_fin > timeStr);

          bodyHtml += `<td>${slotsForTime.map(s => `<div class="slot-item" onclick="showSlotDetails('${s.id}')">${s.membre}</div>`).join('')}</td>`;
        }
        bodyHtml += '</tr>';
      }
      document.getElementById('weekBody').innerHTML = bodyHtml;
    }

    function showDaySlots(date) {
      const slotsForDay = allSlots.filter(s => s.date === date);
      if (slotsForDay.length === 0) {
        showAlert('Aucun créneau ce jour-là', 'error');
        return;
      }
      const body = slotsForDay.map(s => `<div class="modal-info" onclick="showSlotDetails('${s.id}')"><strong>${s.membre}</strong><br>${s.heure_debut} - ${s.heure_fin}</div>`).join('');
      document.getElementById('slotModalBody').innerHTML = body;
      document.getElementById('slotModal').classList.add('active');
    }

    window.showSlotDetails = function(slotId) {
      selectedSlot = allSlots.find(s => s.id === slotId);
      if (!selectedSlot) return;

      const isOwner = selectedSlot.membre === currentUser.username;
      const isOtherMember = !isOwner;
      
      document.getElementById('slotModalBody').innerHTML = `
        <div class="modal-info"><strong>Membre:</strong> ${selectedSlot.membre}</div>
        <div class="modal-info"><strong>Date:</strong> ${new Date(selectedSlot.date).toLocaleDateString('fr-FR')}</div>
        <div class="modal-info"><strong>Horaires:</strong> ${selectedSlot.heure_debut} - ${selectedSlot.heure_fin}</div>
      `;
      document.getElementById('editBtn').style.display = isOwner ? 'block' : 'none';
      document.getElementById('deleteBtn').style.display = isOwner ? 'block' : 'none';
      document.getElementById('participateBtn').style.display = isOtherMember ? 'block' : 'none';
      document.getElementById('slotModal').classList.add('active');
    };

    window.closeSlotModal = function() {
      document.getElementById('slotModal').classList.remove('active');
      selectedSlot = null;
    };

    window.editSlot = function() {
      if (!selectedSlot) return;
      closeSlotModal();
      document.getElementById('slotDate').value = selectedSlot.date;
      document.getElementById('slotTimeStart').value = selectedSlot.heure_debut;
      document.getElementById('slotTimeEnd').value = selectedSlot.heure_fin;
      document.getElementById('addSlotCard').scrollIntoView({ behavior: 'smooth' });
      document.getElementById('addSlotForm').dataset.editingSlotId = selectedSlot.id;
    };

    window.deleteSlot = function() {
      if (!selectedSlot || !confirm('Êtes-vous sûr ?')) return;

      const deleteAsync = async () => {
        try {
          const res = await fetch(`/api/serre-slots/${selectedSlot.id}`, { method: 'DELETE' });
          if (res.ok) {
            showAlert('✅ Supprimé !', 'success');
            closeSlotModal();
            loadSlots();
          } else throw new Error('Erreur');
        } catch (e) {
          const slots = JSON.parse(localStorage.getItem("serreSlots") || '[]');
          localStorage.setItem("serreSlots", JSON.stringify(slots.filter(s => s.id !== selectedSlot.id)));
          showAlert('✅ Supprimé (local)', 'success');
          closeSlotModal();
          loadSlots();
        }
      };
      deleteAsync();
    };

    window.participateSlot = function() {
      if (!selectedSlot) return;
      
      const participateAsync = async () => {
        try {
          const res = await fetch('/api/serre-participations', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              slot_id: selectedSlot.id,
              participant: currentUser.username,
              recipient: selectedSlot.membre,
              date: selectedSlot.date,
              heure_debut: selectedSlot.heure_debut,
              heure_fin: selectedSlot.heure_fin
            })
          });
          
          if (res.ok) {
            showAlert('✅ Participation enregistrée ! Une notification a été envoyée.', 'success');
            closeSlotModal();
            loadSlots();
          } else {
            const error = await res.text();
            throw new Error(error);
          }
        } catch (e) {
          console.log("Mode local:", e);
          showAlert('✅ Participation enregistrée (local) !', 'success');
          closeSlotModal();
          loadSlots();
        }
      };
      participateAsync();
    };

    document.getElementById('viewMonth').addEventListener('click', () => {
      document.getElementById('monthView').classList.remove('hidden');
      document.getElementById('weekView').classList.remove('active');
      document.getElementById('viewMonth').classList.add('active');
      document.getElementById('viewWeek').classList.remove('active');
    });

    document.getElementById('viewWeek').addEventListener('click', () => {
      document.getElementById('monthView').classList.add('hidden');
      document.getElementById('weekView').classList.add('active');
      document.getElementById('viewMonth').classList.remove('active');
      document.getElementById('viewWeek').classList.add('active');
    });

    document.getElementById('prevMonth').addEventListener('click', () => {
      currentViewDate.setMonth(currentViewDate.getMonth() - 1);
      renderMonth();
    });

    document.getElementById('nextMonth').addEventListener('click', () => {
      currentViewDate.setMonth(currentViewDate.getMonth() + 1);
      renderMonth();
    });

    document.getElementById('prevWeek').addEventListener('click', () => {
      currentViewDate.setDate(currentViewDate.getDate() - 7);
      renderWeek();
    });

    document.getElementById('nextWeek').addEventListener('click', () => {
      currentViewDate.setDate(currentViewDate.getDate() + 7);
      renderWeek();
    });

    document.getElementById('addSlotForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const slot = {
        date: document.getElementById('slotDate').value,
        heure_debut: document.getElementById('slotTimeStart').value,
        heure_fin: document.getElementById('slotTimeEnd').value,
        membre: currentUser.username
      };

      const editingSlotId = e.target.dataset.editingSlotId;

      try {
        let res;
        if (editingSlotId) {
          res = await fetch(`/api/serre-slots/${editingSlotId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(slot)
          });
        } else {
          res = await fetch('/api/serre-slots', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(slot)
          });
        }

        if (res.ok) {
          showAlert(`✅ Créneau ${editingSlotId ? 'modifié' : 'ajouté'} !`, 'success');
          document.getElementById('addSlotForm').reset();
          delete document.getElementById('addSlotForm').dataset.editingSlotId;
          loadSlots();
        } else throw new Error('Erreur');
      } catch (e) {
        slot.id = editingSlotId || ('slot_' + Date.now());
        let slots = JSON.parse(localStorage.getItem("serreSlots") || '[]');
        
        if (editingSlotId) {
          const idx = slots.findIndex(s => s.id === editingSlotId);
          if (idx !== -1) slots[idx] = slot;
        } else {
          slots.push(slot);
        }
        
        localStorage.setItem("serreSlots", JSON.stringify(slots));
        showAlert(`✅ ${editingSlotId ? 'Modifié' : 'Ajouté'} (local)`, 'success');
        document.getElementById('addSlotForm').reset();
        delete document.getElementById('addSlotForm').dataset.editingSlotId;
        loadSlots();
      }
    });

    loadSlots();
  </script>
</body>
</html>
