<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Emploi du Temps - Serre</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #020617;
      color: #e5e7eb;
      min-height: 100vh;
    }
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      min-height: 56px;
      background: rgba(15, 23, 42, 0.98);
      border-bottom: 1px solid #1f2937;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 16px;
      z-index: 50;
      flex-wrap: wrap;
      gap: 4px;
    }
    .navbar-left { display: flex; align-items: center; gap: 10px; }
    .navbar-title { font-size: 0.95rem; font-weight: 600; color: #e5e7eb; }
    .navbar-user { font-size: 0.8rem; color: #9ca3af; }
    .navbar-menu { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .nav-btn { border: none; background: transparent; color: #cbd5f5; font-size: 0.8rem; padding: 6px 8px; border-radius: 999px; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .nav-btn span.icon { font-size: 1rem; }
    .nav-btn.active { background: #1d4ed8; color: #e5e7eb; }
    .nav-btn:hover { background: #111827; }
    .navbar-logout { border-radius: 999px; border: 1px solid #374151; background: #111827; color: #e5e7eb; padding: 5px 10px; font-size: 0.8rem; cursor: pointer; }
    .navbar-logout:hover { background: #1f2937; }
    .page { padding-top: 72px; padding-left: 12px; padding-right: 12px; padding-bottom: 20px; max-width: 1400px; margin: 0 auto; }
    .card { background: #020617; border-radius: 10px; border: 1px solid #1f2937; padding: 14px 16px; margin-bottom: 14px; }
    .card h1 { font-size: 1.4rem; margin-bottom: 6px; color: #38bdf8; }
    .card h2 { font-size: 1.05rem; margin-bottom: 6px; color: #e5e7eb; }
    .card p { font-size: 0.85rem; color: #d1d5db; }
    .subtitle { font-size: 0.85rem; color: #9ca3af; margin-bottom: 12px; }
    .view-controls { display: flex; gap: 8px; margin-bottom: 12px; }
    .view-btn { padding: 6px 12px; border: 1px solid #1f2937; background: #111827; color: #cbd5f5; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
    .view-btn.active { background: #1d4ed8; color: #e5e7eb; border-color: #1d4ed8; }
    .view-btn:hover { background: #1f2937; }
    .month-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 8px 12px; background: #111827; border-radius: 8px; border: 1px solid #1f2937; }
    .month-nav button { border: none; background: #1d4ed8; color: white; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
    .month-nav button:hover { background: #1e40af; }
    .month-title { font-weight: 600; color: #e5e7eb; }
    .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 14px; }
    .weekday { font-weight: 600; color: #38bdf8; text-align: center; padding: 8px; font-size: 0.85rem; }
    .day-cell { min-height: 80px; padding: 8px; background: #111827; border: 1px solid #1f2937; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
    .day-cell:hover { border-color: #1d4ed8; background: #1a1f2e; }
    .day-cell.today { border: 2px solid #1d4ed8; }
    .day-number { font-weight: 600; margin-bottom: 4px; font-size: 0.9rem; }
    .day-slots { font-size: 0.7rem; color: #9ca3af; max-height: 50px; overflow: hidden; }
    .slot-badge { display: inline-block; background: #38bdf8; color: #020617; padding: 2px 4px; border-radius: 3px; margin: 2px 0; font-size: 0.65rem; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .month-view { display: block; }
    .month-view.hidden { display: none; }
    .form-group { margin-bottom: 12px; }
    .form-label { display: block; font-size: 0.8rem; font-weight: 600; color: #cbd5f5; margin-bottom: 4px; }
    .form-control { width: 100%; padding: 6px 8px; border: 1px solid #1f2937; background: #111827; color: #e5e7eb; border-radius: 4px; font-size: 0.8rem; }
    .form-control:focus { outline: none; border-color: #1d4ed8; box-shadow: 0 0 0 2px rgba(29, 78, 216, 0.2); }
    .btn { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: all 0.2s; }
    .btn-primary { background: #1d4ed8; color: white; }
    .btn-primary:hover { background: #1e40af; }
    .alert { padding: 12px 16px; border-radius: 6px; margin-bottom: 12px; font-size: 0.85rem; }
    .alert-success { background: rgba(34, 197, 94, 0.1); color: #22c55e; border: 1px solid #22c55e; }
    .alert-error { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid #ef4444; }
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; border-bottom: 1px solid #1f2937; }
    .tab-btn { padding: 8px 12px; border: none; background: transparent; color: #9ca3af; cursor: pointer; font-weight: 500; border-bottom: 2px solid transparent; transition: all 0.2s; }
    .tab-btn.active { color: #38bdf8; border-bottom-color: #38bdf8; }
    .tab-btn:hover { color: #cbd5f5; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .notifications-list { display: flex; flex-direction: column; gap: 8px; }
    .notification-item { background: #111827; border: 1px solid #1f2937; border-radius: 6px; padding: 10px 12px; }
    .notification-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .notification-title { font-weight: 600; color: #e5e7eb; font-size: 0.9rem; }
    .notification-date { font-size: 0.75rem; color: #9ca3af; }
    .notification-meta { font-size: 0.8rem; color: #d1d5db; margin-bottom: 4px; }
    .notification-badge { display: inline-block; background: #1d4ed8; color: white; padding: 2px 6px; border-radius: 999px; font-size: 0.7rem; font-weight: 600; }
    .my-slots-list { display: flex; flex-direction: column; gap: 8px; }
    .slot-card { background: #111827; border: 1px solid #1f2937; border-radius: 6px; padding: 12px; }
    .slot-card-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px; }
    .slot-card-title { font-weight: 600; color: #e5e7eb; font-size: 0.95rem; }
    .slot-card-actions { display: flex; gap: 4px; }
    .slot-card-btn { padding: 4px 8px; border: none; background: #1d4ed8; color: white; border-radius: 4px; cursor: pointer; font-size: 0.75rem; transition: all 0.2s; }
    .slot-card-btn:hover { background: #1e40af; }
    .slot-card-btn.danger { background: #991b1b; }
    .slot-card-btn.danger:hover { background: #7f1d1d; }
    .slot-card-info { font-size: 0.85rem; color: #d1d5db; margin-bottom: 8px; }
    .participants-list { background: #020617; border-radius: 4px; padding: 8px; }
    .participant-item { font-size: 0.8rem; color: #cbd5f5; padding: 4px 0; display: flex; align-items: center; gap: 6px; }
    .participant-item:before { content: "✓"; color: #22c55e; font-weight: 600; }
    @media (max-width: 768px) { .page { padding-top: 90px; } }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="navbar-left">
      <div>
        <div class="navbar-title">Espace adhérent</div>
        <div class="navbar-user" id="navbarUser">Non connecté</div>
      </div>
    </div>
    <div class="navbar-menu" id="navbarMenu">
      <button class="nav-btn" data-link="index.html"><span class="icon">🏠</span><span>Accueil</span></button>
      <button class="nav-btn" data-link="fiche.html"><span class="icon">📄</span><span>Fiche</span></button>
      <button class="nav-btn" data-link="aquarium.html"><span class="icon">🐟</span><span>Aquarium</span></button>
      <button class="nav-btn active" data-link="serre.html" data-requires-serre="1"><span class="icon">🌱</span><span>Serre</span></button>
      <button class="nav-btn" data-link="calcule.html"><span class="icon">📐</span><span>Calcule</span></button>
      <button class="nav-btn" data-link="echange.html"><span class="icon">💬</span><span>Échange</span></button>
      <button class="nav-btn" data-link="population.html"><span class="icon">👥</span><span>Population</span></button>
      <button class="nav-btn" data-link="bureau.html" data-requires-bureau="1"><span class="icon">🏛️</span><span>Bureau</span></button>
      <button class="navbar-logout" id="logoutBtn">Déconnexion</button>
    </div>
  </header>

  <main class="page">
    <div class="card">
      <h1>🌱 Emploi du Temps - Serre</h1>
      <p class="subtitle">Gère les créneaux horaires de la serre</p>
      <div id="alertContainer"></div>
    </div>

    <!-- Onglets : Vue Calendrier vs Dashboard Créateur -->
    <div class="card">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('calendar')">📅 Calendrier</button>
        <button class="tab-btn" id="dashboardTabBtn" style="display: none;" onclick="switchTab('dashboard')">📊 Mon Dashboard</button>
      </div>

      <!-- TAB 1 : CALENDRIER -->
      <div id="calendar" class="tab-content active">
        <div class="view-controls">
          <button class="view-btn active" id="viewMonth">📅 Mois</button>
        </div>

        <div id="monthView" class="month-view active">
          <div class="month-nav">
            <button id="prevMonth">← Mois précédent</button>
            <div class="month-title" id="monthTitle">Janvier 2026</div>
            <button id="nextMonth">Mois suivant →</button>
          </div>
          <div class="calendar" id="monthCalendar"></div>
        </div>
      </div>

      <!-- TAB 2 : DASHBOARD CRÉATEUR -->
      <div id="dashboard" class="tab-content">
        <h2>Mes Créneaux et Participants</h2>
        <p class="subtitle">Créneaux que vous avez créés et les participants</p>
        
        <div class="tabs" style="margin-top: 12px;">
          <button class="tab-btn active" onclick="switchDashboardTab('my-slots')">Mes créneaux</button>
          <button class="tab-btn" onclick="switchDashboardTab('notifications')">Notifications</button>
        </div>

        <!-- DASHBOARD SUB-TAB 1 : MES CRÉNEAUX -->
        <div id="my-slots" class="tab-content active">
          <div id="mySlotsList" class="my-slots-list"></div>
        </div>

        <!-- DASHBOARD SUB-TAB 2 : NOTIFICATIONS -->
        <div id="notifications" class="tab-content">
          <div id="notificationsList" class="notifications-list"></div>
        </div>
      </div>
    </div>

    <!-- Formulaire d'ajout de créneau (visible seulement pour créateur) -->
    <div class="card" id="addSlotCard" style="display: none;">
      <h2>➕ Ajouter un Créneau</h2>
      <p class="subtitle">Enregistrez votre disponibilité</p>
      <form id="addSlotForm">
        <div class="form-group">
          <label class="form-label">Date</label>
          <input type="date" id="slotDate" class="form-control" required>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
          <div class="form-group">
            <label class="form-label">Heure début</label>
            <input type="time" id="slotTimeStart" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label">Heure fin</label>
            <input type="time" id="slotTimeEnd" class="form-control" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Enregistrer le créneau</button>
      </form>
    </div>
  </main>

  <script>
    const storedUser = localStorage.getItem("user");
    let currentUser = null;
    
    if (storedUser) {
      try {
        currentUser = JSON.parse(storedUser);
      } catch (e) {
        window.location.href = "index.html";
      }
    }

    if (!currentUser || (currentUser.role !== "admin" && currentUser.serre !== true)) {
      window.location.href = "index.html";
    }

    document.getElementById('navbarUser').textContent = currentUser.username + " (" + (currentUser.role === "admin" ? "Admin" : "Serre") + ")";

    document.querySelectorAll(".nav-btn[data-link]").forEach(btn => {
      btn.addEventListener("click", () => {
        window.location.href = btn.dataset.link;
      });
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem("user");
      window.location.href = "index.html";
    });

    document.getElementById("addSlotCard").style.display = "block";

    let currentViewDate = new Date();
    let allSlots = [];
    let allParticipations = [];

    const SERRE_SLOTS_KEY = "serreSlots";
    const SERRE_PARTICIPATIONS_KEY = "serreParticipations";
    const alertContainer = document.getElementById('alertContainer');

    function showAlert(message, type = 'success') {
      const alert = document.createElement('div');
      alert.className = `alert alert-${type}`;
      alert.textContent = message;
      alertContainer.innerHTML = '';
      alertContainer.appendChild(alert);
      setTimeout(() => alert.remove(), 4000);
    }

    async function loadSlots() {
      try {
        const res = await fetch('/api/serre-slots');
        if (!res.ok) throw new Error('Erreur réseau');
        let rawSlots = await res.json();
        
        allSlots = rawSlots.map(s => {
          let dateStr = s.date;
          if (dateStr.includes('T')) {
            dateStr = dateStr.substring(0, 10);
          }
          return {
            ...s,
            date: dateStr,
            heure_debut: typeof s.heure_debut === 'string' ? s.heure_debut.substring(0, 5) : s.heure_debut,
            heure_fin: typeof s.heure_fin === 'string' ? s.heure_fin.substring(0, 5) : s.heure_fin
          };
        });
        
        console.log('✅ Créneaux chargés:', allSlots);
        renderMonth();
      } catch (e) {
        console.log("Mode local:", e);
        const raw = localStorage.getItem(SERRE_SLOTS_KEY);
        allSlots = raw ? JSON.parse(raw) : [];
        renderMonth();
      }
    }

    async function loadParticipations() {
      try {
        const res = await fetch('/api/serre-participations');
        if (!res.ok) throw new Error('Erreur réseau');
        allParticipations = await res.json();
        console.log('✅ Participations chargées:', allParticipations);
      } catch (e) {
        console.log("Mode local:", e);
        const raw = localStorage.getItem(SERRE_PARTICIPATIONS_KEY);
        allParticipations = raw ? JSON.parse(raw) : [];
      }
    }

    function renderMonth() {
      const year = currentViewDate.getFullYear();
      const month = currentViewDate.getMonth();
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const daysInMonth = lastDay.getDate();
      const startingDayOfWeek = firstDay.getDay();

      document.getElementById('monthTitle').textContent = currentViewDate.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });

      const weekdays = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'];
      let html = weekdays.map(day => `<div class="weekday">${day}</div>`).join('');

      for (let i = 0; i < startingDayOfWeek; i++) {
        html += '<div class="day-cell" style="opacity: 0.3;"><div class="day-number">-</div></div>';
      }

      const today = new Date();
      for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(year, month, day);
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const slotsForDay = allSlots.filter(s => s.date === dateStr);
        const isToday = date.toDateString() === today.toDateString();

        html += `<div class="day-cell ${isToday ? 'today' : ''}">
          <div class="day-number">${day}</div>
          <div class="day-slots">
            ${slotsForDay.map(s => `<div class="slot-badge">${s.membre}: ${s.heure_debut}</div>`).join('')}
          </div>
        </div>`;
      }

      const totalCells = Math.ceil((daysInMonth + startingDayOfWeek) / 7) * 7;
      for (let day = 1; day <= totalCells - daysInMonth - startingDayOfWeek; day++) {
        html += '<div class="day-cell" style="opacity: 0.3;"><div class="day-number">-</div></div>';
      }

      document.getElementById('monthCalendar').innerHTML = html;
    }

    function renderMySlots() {
      const mySlots = allSlots.filter(s => s.membre === currentUser.username);
      const mySlotsList = document.getElementById('mySlotsList');

      if (!mySlots.length) {
        mySlotsList.innerHTML = '<p style="color: #9ca3af; font-size: 0.85rem;">Aucun créneau créé.</p>';
        return;
      }

      mySlotsList.innerHTML = mySlots.map(slot => {
        const slotParticipants = allParticipations.filter(p => p.slot_id === slot.id);
        const d = new Date(slot.date);
        const dateStr = d.toLocaleDateString('fr-FR');

        return `<div class="slot-card">
          <div class="slot-card-header">
            <div class="slot-card-title">${dateStr} · ${slot.heure_debut} - ${slot.heure_fin}</div>
            <div class="slot-card-actions">
              <button class="slot-card-btn" onclick="editSlot('${slot.id}')">✏️ Modifier</button>
              <button class="slot-card-btn danger" onclick="deleteSlot('${slot.id}')">🗑️ Supprimer</button>
            </div>
          </div>
          <div class="slot-card-info">
            <strong>${slotParticipants.length}</strong> participant(s)
          </div>
          ${slotParticipants.length > 0 ? `
            <div class="participants-list">
              <strong style="color: #cbd5f5; font-size: 0.8rem;">Participants:</strong>
              ${slotParticipants.map(p => `<div class="participant-item">${p.participant_username}</div>`).join('')}
            </div>
          ` : ''}
        </div>`;
      }).join("");
    }

    function renderNotifications() {
      const mySlotIds = allSlots.filter(s => s.membre === currentUser.username).map(s => s.id);
      const myNotifications = allParticipations.filter(p => mySlotIds.includes(p.slot_id));
      const notificationsList = document.getElementById('notificationsList');

      if (!myNotifications.length) {
        notificationsList.innerHTML = '<p style="color: #9ca3af; font-size: 0.85rem;">Aucune notification.</p>';
        return;
      }

      notificationsList.innerHTML = myNotifications.map(notif => {
        const slot = allSlots.find(s => s.id === notif.slot_id);
        const d = new Date(notif.date);
        const dateStr = d.toLocaleDateString('fr-FR');

        return `<div class="notification-item">
          <div class="notification-header">
            <div class="notification-title">✅ ${notif.participant_username} participe</div>
            <div class="notification-date">${dateStr}</div>
          </div>
          <div class="notification-meta">
            Créneau: <strong>${slot?.heure_debut} - ${slot?.heure_fin}</strong>
          </div>
          <div style="margin-top: 6px;">
            <span class="notification-badge">${notif.status || 'pending'}</span>
          </div>
        </div>`;
      }).join("");
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      
      document.getElementById(tabName).classList.add('active');
      event.target.classList.add('active');

      if (tabName === 'dashboard') {
        renderMySlots();
        renderNotifications();
      }
    }

    function switchDashboardTab(tabName) {
      document.querySelectorAll('#dashboard .tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('#dashboard .tab-btn').forEach(btn => btn.classList.remove('active'));
      
      document.getElementById(tabName).classList.add('active');
      event.target.classList.add('active');

      if (tabName === 'my-slots') {
        renderMySlots();
      } else if (tabName === 'notifications') {
        renderNotifications();
      }
    }

    window.editSlot = function(slotId) {
      const slot = allSlots.find(s => s.id === slotId);
      if (!slot) return;
      
      document.getElementById('slotDate').value = slot.date;
      document.getElementById('slotTimeStart').value = slot.heure_debut;
      document.getElementById('slotTimeEnd').value = slot.heure_fin;
      document.getElementById('addSlotForm').dataset.editingSlotId = slotId;
      document.getElementById('addSlotCard').scrollIntoView({ behavior: 'smooth' });
    };

    window.deleteSlot = function(slotId) {
      if (!confirm('Êtes-vous sûr ?')) return;

      const deleteAsync = async () => {
        try {
          const res = await fetch(`/api/serre-slots/${slotId}`, { method: 'DELETE' });
          if (res.ok) {
            showAlert('✅ Supprimé !', 'success');
            loadSlots();
            renderMySlots();
          } else throw new Error('Erreur');
        } catch (e) {
          const slots = JSON.parse(localStorage.getItem(SERRE_SLOTS_KEY) || '[]');
          localStorage.setItem(SERRE_SLOTS_KEY, JSON.stringify(slots.filter(s => s.id !== slotId)));
          showAlert('✅ Supprimé (local)', 'success');
          loadSlots();
          renderMySlots();
        }
      };
      deleteAsync();
    };

    document.getElementById('prevMonth').addEventListener('click', () => {
      currentViewDate.setMonth(currentViewDate.getMonth() - 1);
      renderMonth();
    });

    document.getElementById('nextMonth').addEventListener('click', () => {
      currentViewDate.setMonth(currentViewDate.getMonth() + 1);
      renderMonth();
    });

    document.getElementById('addSlotForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const slot = {
        date: document.getElementById('slotDate').value,
        heure_debut: document.getElementById('slotTimeStart').value,
        heure_fin: document.getElementById('slotTimeEnd').value,
        membre: currentUser.username
      };

      const editingSlotId = e.target.dataset.editingSlotId;

      try {
        let res;
        if (editingSlotId) {
          res = await fetch(`/api/serre-slots/${editingSlotId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(slot)
          });
        } else {
          res = await fetch('/api/serre-slots', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(slot)
          });
        }

        if (res.ok) {
          showAlert(`✅ Créneau ${editingSlotId ? 'modifié' : 'ajouté'} !`, 'success');
          document.getElementById('addSlotForm').reset();
          delete document.getElementById('addSlotForm').dataset.editingSlotId;
          loadSlots();
          renderMySlots();
        } else throw new Error('Erreur');
      } catch (e) {
        slot.id = editingSlotId || ('slot_' + Date.now());
        let slots = JSON.parse(localStorage.getItem(SERRE_SLOTS_KEY) || '[]');
        
        if (editingSlotId) {
          const idx = slots.findIndex(s => s.id === editingSlotId);
          if (idx !== -1) slots[idx] = slot;
        } else {
          slots.push(slot);
        }
        
        localStorage.setItem(SERRE_SLOTS_KEY, JSON.stringify(slots));
        showAlert(`✅ ${editingSlotId ? 'Modifié' : 'Ajouté'} (local)`, 'success');
        document.getElementById('addSlotForm').reset();
        delete document.getElementById('addSlotForm').dataset.editingSlotId;
        loadSlots();
        renderMySlots();
      }
    });

    // Afficher le tab Dashboard si connecté et serre/admin
    if (currentUser && (currentUser.role === "admin" || currentUser.serre === true)) {
      document.getElementById('dashboardTabBtn').style.display = "inline-flex";
    }

    loadSlots();
    loadParticipations();
  </script>
</body>
</html>
